              void linkMenu(final String link) {
                  String[] items = {S.t("open_new"), S.t("open_bg"), S.t("copy_link"), S.t("share"), S.t("dl_link"), S.t("report_link")};
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(pretty(link))
                          .setItems(items, new android.content.DialogInterface.OnClickListener() {
                              @Override public void onClick(android.content.DialogInterface d, int which) {
                                  if (which == 0) newTab(link, true);
                                  else if (which == 1) { Tab nt = newTab(link, false); nt.opener = cur; toast(S.t("open_bg_done")); }
                                  else if (which == 2) copyText(link);
                                  else if (which == 3) shareText(link);
                                  else if (which == 4) startDownload(link, mobileUa, null, null);
                                  else quickReport(link);
                              }
                          }).show();
              }

