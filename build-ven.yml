              static String pretty(String url) {
                  if (url == null) return "";
                  String s = url;
                  if (s.startsWith("https://")) s = s.substring(8);
                  else if (s.startsWith("http://")) s = s.substring(7);
                  if (s.startsWith("www.")) s = s.substring(4);
                  if (s.endsWith("/")) s = s.substring(0, s.length() - 1);
                  return s;
              }

              static boolean isWeb(String u) { return u != null && (u.startsWith("http://") || u.startsWith("https://")); }

              String realUrl() {
                  if (cur == null) return null;
                  String u = cur.web.getUrl();
                  return isWeb(u) && !u.startsWith(Pages.BASE) ? u : null;
              }

              JSONArray getArr(String key) {
                  try { return new JSONArray(prefs.getString(key, "[]")); } catch (Exception e) { return new JSONArray(); }
              }

              JSONArray prepend(JSONArray a, JSONObject o, int cap) {
                  JSONArray n = new JSONArray();
                  n.put(o);
                  for (int i = 0; i < a.length() && n.length() < cap; i++) n.put(a.opt(i));
                  return n;
              }

