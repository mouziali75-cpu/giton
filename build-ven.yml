              void readAloud() {
                  if (realUrl() == null) { toast(S.t("no_page")); return; }
                  if (ttsSpeaking && tts != null) {
                      tts.stop();
                      ttsSpeaking = false;
                      toast(S.t("t_stopped"));
                      return;
                  }
                  cur.web.evaluateJavascript("(function(){var t=document.body?document.body.innerText:'';return t.slice(0,60000);})()",
                          new ValueCallback<String>() {
                              @Override public void onReceiveValue(String v) {
                                  String text = "";
                                  try {
                                      Object o = new JSONTokener(v).nextValue();
                                      if (o instanceof String) text = (String) o;
                                  } catch (Exception e) { /* ignore */ }
                                  startTts(text);
                              }
                          });
              }

              void startTts(String text) {
                  if (text == null || text.trim().isEmpty()) { toast(S.t("tts_empty")); return; }
                  ttsPending = text;
                  if (tts == null) {
                      tts = new android.speech.tts.TextToSpeech(this, new android.speech.tts.TextToSpeech.OnInitListener() {
                          @Override public void onInit(int status) {
                              ttsReady = status == android.speech.tts.TextToSpeech.SUCCESS;
                              if (ttsReady) {
                                  try { tts.setLanguage(new Locale(S.lang)); } catch (Exception e) { /* ignore */ }
                                  speakPending();
                              } else {
                                  toast(S.t("tts_fail"));
                              }
                          }
                      });
                  } else if (ttsReady) {
                      speakPending();
                  }
              }

              void speakPending() {
                  String text = ttsPending;
                  if (text == null || tts == null) return;
                  ttsPending = null;
                  int max = 3500;
                  try { max = Math.min(max, android.speech.tts.TextToSpeech.getMaxSpeechInputLength() - 100); } catch (Throwable e) { /* ignore */ }
                  if (max < 500) max = 500;
                  int i = 0, n = 0;
                  while (i < text.length()) {
                      int end = Math.min(text.length(), i + max);
                      if (end < text.length()) {
                          int sp = text.lastIndexOf(' ', end);
                          if (sp > i + 200) end = sp;
                      }
                      String chunk = text.substring(i, end).trim();
                      if (!chunk.isEmpty()) {
                          tts.speak(chunk, n == 0 ? android.speech.tts.TextToSpeech.QUEUE_FLUSH : android.speech.tts.TextToSpeech.QUEUE_ADD, null, "ven" + n);
                      }
                      n++;
                      i = end;
                  }
                  ttsSpeaking = true;
                  toast(S.t("t_reading"));
              }

              void addHomeShortcut() {
                  String u = realUrl();
                  if (u == null) { toast(S.t("no_page")); return; }
                  try {
                      android.content.pm.ShortcutManager sm = getSystemService(android.content.pm.ShortcutManager.class);
                      if (sm != null && sm.isRequestPinShortcutSupported()) {
                          Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(u));
                          i.setClass(this, MainActivity.class);
                          String label = cur.title == null || cur.title.isEmpty() ? pretty(u) : cur.title;
                          if (label.length() > 24) label = label.substring(0, 24);
                          android.content.pm.ShortcutInfo info = new android.content.pm.ShortcutInfo.Builder(this, "site" + Math.abs(u.hashCode()))
                                  .setShortLabel(label)
                                  .setIcon(android.graphics.drawable.Icon.createWithResource(this, R.mipmap.ic_launcher))
                                  .setIntent(i)
                                  .build();
                          sm.requestPinShortcut(info, null);
                      } else {
                          toast(S.t("shortcut_fail"));
                      }
                  } catch (Exception e) {
                      toast(S.t("shortcut_fail"));
                  }
              }

