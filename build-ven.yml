                  try {
                      if (code == null || code.trim().isEmpty()) return null;
                      JSONObject meta = parseMeta(code);
                      JSONArray a = list(p);
                      String name = meta.optString("name", "");
                      if (name.isEmpty()) name = "Script " + (a.length() + 1);
                      String id = null;
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject it = a.optJSONObject(i);
                          if (it != null && name.equals(it.optString("name")) && (url == null || url.isEmpty() || url.equals(it.optString("url")))) { id = it.optString("id"); a.remove(i); break; }
                      }
                      boolean on = true;
                      if (id == null) id = UUID.randomUUID().toString().substring(0, 8);
                      FileOutputStream fo = new FileOutputStream(file(c, id));
                      fo.write(code.getBytes("UTF-8"));
                      fo.close();
                      meta.put("name", name).put("id", id).put("on", on).put("url", url == null ? "" : url);
                      a.put(meta);
                      save(p, a);
                      return name;
                  } catch (Exception e) { return null; }
              }

              static void remove(Context c, SharedPreferences p, String id) {
                  JSONArray a = list(p), out = new JSONArray();
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject it = a.optJSONObject(i);
                      if (it != null && !id.equals(it.optString("id"))) out.put(it);
                  }
                  file(c, id).delete();
                  save(p, out);
              }

              static void setOn(SharedPreferences p, String id, boolean on) {
                  JSONArray a = list(p);
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject it = a.optJSONObject(i);
                      try { if (it != null && id.equals(it.optString("id"))) it.put("on", on); } catch (Exception e) { /* ignore */ }
                  }
                  save(p, a);
              }

              static String fetch(String url) {
                  try {
                      HttpURLConnection con = (HttpURLConnection) new URL(url).openConnection();
                      con.setConnectTimeout(10000);
                      con.setReadTimeout(20000);
                      con.setInstanceFollowRedirects(true);
                      con.setRequestProperty("User-Agent", "Mozilla/5.0 Ven");
                      if (con.getResponseCode() != 200) { con.disconnect(); return null; }
                      InputStream in = con.getInputStream();
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) {
                          bo.write(buf, 0, n);
                          if (bo.size() > 12 * 1024 * 1024) { in.close(); con.disconnect(); return null; }
                      }
                      in.close();
                      con.disconnect();
                      return bo.toString("UTF-8");
                  } catch (Exception e) { return null; }
              }

              /** download + install; returns the name or null */
              static String install(Context c, SharedPreferences p, String url) {
                  if (url == null || !url.startsWith("http")) return null;
                  String code = fetch(url.trim());
                  return code == null ? null : add(c, p, code, url.trim());
              }

              /** re-downloads every script that came from a link; returns how many changed */
              static int updateAll(Context c, SharedPreferences p) {
                  int n = 0;
                  JSONArray a = list(p);
                  ArrayList<String> urls = new ArrayList<>();
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject it = a.optJSONObject(i);
                      if (it != null && it.optString("url").startsWith("http")) urls.add(it.optString("url"));
                  }
                  for (String u : urls) if (install(c, p, u) != null) n++;
                  return n;
              }

              private static String wrap(String id, JSONObject it, String code) {
                  StringBuilder b = new StringBuilder();
                  b.append("(function(){try{if(window.top!==window)return;var M=").append(it.optJSONArray("m")).append(",X=").append(it.optJSONArray("x"))
                          .append(";var h=location.href,ok=M.length===0;for(var i=0;i<M.length;i++){try{if(new RegExp(M[i]).test(h)){ok=true;break;}}catch(e){}}")
                          .append("for(var j=0;j<X.length;j++){try{if(new RegExp(X[j]).test(h)){ok=false;break;}}catch(e){}}if(!ok)return;")
                          .append("var __id=").append(JSONObject.quote(id)).append(";if(window['__vs_'+__id])return;window['__vs_'+__id]=1;")
                          .append("var GM_info={script:{name:").append(JSONObject.quote(it.optString("name"))).append(",version:").append(JSONObject.quote(it.optString("ver")))
                          .append("},scriptHandler:'Ven'};")
                          .append(SHIM)
                          .append("(function(unsafeWindow,GM_addStyle,GM_getValue,GM_setValue,GM_deleteValue,GM_listValues,GM_xmlhttpRequest,GM_openInTab,GM_log,GM_registerMenuCommand,GM_setClipboard,GM_info){")
                          .append(code)
                          .append("\n}).call(window,window,GM_addStyle,GM_getValue,GM_setValue,GM_deleteValue,GM_listValues,GM_xmlhttpRequest,GM_openInTab,GM_log,GM_registerMenuCommand,GM_setClipboard,GM_info);")
                          .append("}catch(e){try{console.log('Ven script error: '+e);}catch(_){}}})();");
                  return b.toString();
              }

              /** ready-to-run scripts of one phase (start = @run-at document-start); each one checks its own @match rules */
              static ArrayList<String> build(Context c, SharedPreferences p, boolean start) {
                  ArrayList<String> out = new ArrayList<>();
                  JSONArray a = list(p);
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject it = a.optJSONObject(i);
                      if (it == null || !it.optBoolean("on", true) || it.optBoolean("start", false) != start) continue;
                      String id = it.optString("id");
                      String js;
                      synchronized (CACHE) {
                          js = CACHE.get(id);
                          if (js == null) {
                              js = wrap(id, it, read(file(c, id)));
                              CACHE.put(id, js);
                          }
                      }
                      out.add(js);
                  }
                  return out;
              }
          }
