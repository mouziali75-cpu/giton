                  sb.append("<div class=\"stats\">").append(ic("shield", "🛡️")).append(" ").append(esc(st)).append("<br><br>").append(esc(S.t("copyright"))).append("</div>");
                  sb.append("</body></html>");
                  return sb.toString();
