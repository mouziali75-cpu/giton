          import java.net.URLEncoder;
          import java.util.ArrayList;

          /** Generates the internal pages served from https://sg.invalid/ */
          final class Pages {
              static final String HOST = "sg.invalid";
              static final String BASE = "https://sg.invalid/";

              static String esc(String s) {
                  if (s == null) return "";
                  return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace("\"", "&quot;");
              }

              /** An image set by the owner for this emoji, or the emoji itself. */
              static String ic(String key, String fallback) {
                  String u = Shield.icon(key);
                  if (u != null) return "<img class=\"ei\" alt=\"\" src=\"" + esc(u) + "\">";
                  return esc(fallback);
              }

              static String enc(String s) {
                  try { return URLEncoder.encode(s, "UTF-8"); } catch (Exception e) { return ""; }
              }

              private static String head(String title, String accent) {
                  String dir = S.rtl() ? "rtl" : "ltr";
                  return "<!DOCTYPE html><html dir=\"" + dir + "\"><head><meta charset=\"utf-8\">"
                          + "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">"
                          + "<title>" + esc(title) + "</title><style>"
