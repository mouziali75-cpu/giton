              private static boolean download(String url, File dest) { return download(url, dest, 1000); }

              private static boolean download(String url, File dest, int minBytes) {
                  try {
                      HttpURLConnection con = (HttpURLConnection) new URL(url).openConnection();
                      con.setConnectTimeout(12000);
                      con.setReadTimeout(30000);
                      con.setRequestProperty("User-Agent", "VenBrowser/1.0");
                      if (con.getResponseCode() != 200) return false;
                      File tmp = new File(dest.getPath() + ".tmp");
                      InputStream in = con.getInputStream();
                      OutputStream out = new FileOutputStream(tmp);
                      byte[] buf = new byte[16384];
                      int n;
                      long total = 0;
                      while ((n = in.read(buf)) > 0) {
                          out.write(buf, 0, n);
                          total += n;
                          if (total > 40L * 1024 * 1024) break;
                      }
                      out.close();
                      in.close();
                      if (total < minBytes) { tmp.delete(); return false; }
                      if (dest.exists()) dest.delete();
                      return tmp.renameTo(dest);
                  } catch (Exception e) {
                      return false;
                  }
              }

              private static Set<String> readFile(File f) {
