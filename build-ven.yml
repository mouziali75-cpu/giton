name: Build Ven APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        run: |
          set -e
          mkdir -p sgb-android sgb-android/app sgb-android/app/src/main sgb-android/app/src/main/java/app/scamguard/browser sgb-android/app/src/main/res/drawable sgb-android/app/src/main/res/drawable-nodpi sgb-android/app/src/main/res/mipmap-anydpi-v26 sgb-android/app/src/main/res/values
          cat > sgb-android/app/build.gradle <<'SGB_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'app.scamguard.browser'
              compileSdk 34

              defaultConfig {
                  applicationId 'app.ven.browser'
                  minSdk 26
                  targetSdk 34
                  versionCode 9
                  versionName '1.8'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          SGB_EOF
          cat > sgb-android/app/src/main/AndroidManifest.xml <<'SGB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Ven"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <meta-data
                      android:name="android.webkit.WebView.EnableSafeBrowsing"
                      android:value="true" />

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="ven" android:host="auth" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          SGB_EOF
          cat > sgb-android/app/src/main/java/app/scamguard/browser/Account.java <<'SGB_EOF'
          package app.scamguard.browser;

          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.ComponentName;
          import android.net.Uri;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.HashSet;
          import java.util.Set;
          import java.util.UUID;

          /** Ven account: sign in with Google or Discord, then bookmarks / history / settings follow you to every device. */
          final class Account {
              static final String BASE = "https://ticoo.wispbyte.org";
              private static final String[] BOOL = {"anti", "ads", "popups", "nsfw", "https", "tp", "suggest", "noredir",
                      "nopay", "strip", "nodl", "darkweb", "def_desktop"};

              private Account() { }

              static String token(SharedPreferences p) { return p.getString("acc_token", ""); }
              static boolean signedIn(SharedPreferences p) { return !token(p).isEmpty(); }

              static void signOut(SharedPreferences p) {
                  p.edit().remove("acc_token").remove("acc_name").remove("acc_g").remove("acc_d").apply();
              }

              /** opens the sign-in page in the phone's own browser (Google refuses sign-in inside app web views) */
              static void startLogin(Context c, SharedPreferences p, String provider) {
                  try {
                      String url = BASE + "/ven/auth/start?p=" + provider + "&t=" + URLEncoder.encode(token(p), "UTF-8");
                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      Intent ch = Intent.createChooser(i, "Sign in");
                      ch.putExtra(Intent.EXTRA_EXCLUDE_COMPONENTS, new ComponentName[]{new ComponentName(c, MainActivity.class)});
                      c.startActivity(ch);
                  } catch (Exception e) { /* no browser */ }
              }

              private static String call(String method, String path, String token, String body) throws Exception {
                  HttpURLConnection con = (HttpURLConnection) new URL(BASE + path).openConnection();
                  con.setRequestMethod(method);
                  con.setConnectTimeout(10000);
                  con.setReadTimeout(15000);
                  if (token != null && !token.isEmpty()) con.setRequestProperty("Authorization", "Bearer " + token);
                  if (body != null) {
                      con.setDoOutput(true);
                      con.setRequestProperty("Content-Type", "application/json");
                      OutputStream os = con.getOutputStream();
                      os.write(body.getBytes("UTF-8"));
                      os.close();
                  }
                  int code = con.getResponseCode();
                  InputStream in = code >= 400 ? con.getErrorStream() : con.getInputStream();
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  if (in != null) {
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0 && bo.size() < 3 * 1024 * 1024) bo.write(buf, 0, n);
                      in.close();
                  }
                  con.disconnect();
                  if (code == 401) throw new SecurityException("auth");
                  if (code >= 400) throw new Exception("http " + code);
                  return bo.toString("UTF-8");
              }

              /** trades the one-time code from the ven://auth link for a long-lived token */
              static boolean exchange(SharedPreferences p, String code) {
                  try {
                      String r = call("POST", "/ven/auth/exchange", null, new JSONObject().put("code", code).toString());
                      JSONObject o = new JSONObject(r);
                      String t = o.optString("token", "");
                      if (t.isEmpty()) return false;
                      p.edit().putString("acc_token", t).putString("acc_name", o.optString("name", ""))
                              .putBoolean("acc_g", o.optBoolean("google")).putBoolean("acc_d", o.optBoolean("discord")).apply();
                      return true;
                  } catch (Exception e) { return false; }
              }

              private static String dev(SharedPreferences p) {
                  String d = p.getString("dev_id", "");
                  if (d.isEmpty()) { d = UUID.randomUUID().toString(); p.edit().putString("dev_id", d).apply(); }
                  return d;
              }

              static JSONObject localData(SharedPreferences p) throws Exception {
                  JSONObject o = new JSONObject();
                  o.put("bm", new JSONArray(p.getString("bm", "[]")));
                  o.put("hist", new JSONArray(p.getString("hist", "[]")));
                  JSONObject s = new JSONObject();
                  for (String k : BOOL) if (p.contains(k)) s.put(k, p.getBoolean(k, false));
                  s.put("engine", p.getString("engine", "google"));
                  s.put("textsize", p.getInt("textsize", 100));
                  JSONArray so = new JSONArray();
                  for (String h : p.getStringSet("siteoff", new HashSet<String>())) so.put(h);
                  s.put("siteoff", so);
                  o.put("s", s);
                  o.put("dev", dev(p));
                  return o;
              }

              private static JSONArray union(JSONArray a, JSONArray b, int cap) {
                  JSONArray out = new JSONArray();
                  Set<String> seen = new HashSet<>();
                  JSONArray[] both = {a, b};
                  for (JSONArray src : both) {
                      if (src == null) continue;
                      for (int i = 0; i < src.length() && out.length() < cap; i++) {
                          JSONObject o = src.optJSONObject(i);
                          if (o == null) continue;
                          String u = o.optString("u", "");
                          if (u.isEmpty() || !seen.add(u)) continue;
                          out.put(o);
                      }
                  }
                  return out;
              }

              static void apply(SharedPreferences p, JSONObject r, boolean force) throws Exception {
                  SharedPreferences.Editor e = p.edit();
                  e.putString("bm", union(new JSONArray(p.getString("bm", "[]")), r.optJSONArray("bm"), 500).toString());
                  e.putString("hist", union(new JSONArray(p.getString("hist", "[]")), r.optJSONArray("hist"), 300).toString());
                  JSONObject s = r.optJSONObject("s");
                  if (s != null) {
                      if (force || !dev(p).equals(r.optString("dev"))) {      // another phone saved last: take its settings
                          for (String k : BOOL) if (s.has(k)) e.putBoolean(k, s.optBoolean(k));
                          if (s.has("engine")) e.putString("engine", s.optString("engine", "google"));
                          if (s.has("textsize")) e.putInt("textsize", s.optInt("textsize", 100));
                      }
                      Set<String> so = new HashSet<>(p.getStringSet("siteoff", new HashSet<String>()));
                      JSONArray ra = s.optJSONArray("siteoff");
                      if (ra != null) for (int i = 0; i < ra.length(); i++) so.add(ra.optString(i));
                      e.putStringSet("siteoff", so);
                  }
                  e.apply();
              }

              /** 1 = synced, 0 = failed (offline), -1 = the sign-in is no longer valid */
              static int sync(SharedPreferences p) {
                  String t = token(p);
                  if (t.isEmpty()) return 0;
                  try {
                      JSONObject me = new JSONObject(call("GET", "/ven/sync", t, null));
                      p.edit().putString("acc_name", me.optString("name", p.getString("acc_name", "")))
                              .putBoolean("acc_g", me.optBoolean("google")).putBoolean("acc_d", me.optBoolean("discord")).apply();
                      JSONObject rd = me.optJSONObject("data");
                      if (rd != null && rd.length() > 0) apply(p, rd, false);
                      call("PUT", "/ven/sync", t, new JSONObject().put("data", localData(p)).toString());
                      return 1;
                  } catch (SecurityException e) {
                      signOut(p);
                      return -1;
                  } catch (Exception e) { return 0; }
              }
          }
          SGB_EOF
          cat > sgb-android/app/src/main/java/app/scamguard/browser/Feedback.java <<'SGB_EOF'
          package app.scamguard.browser;

          import android.content.SharedPreferences;
          import android.os.Build;

          import org.json.JSONObject;

          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          /** Sends a bug / idea / site report to the bot, which posts it in the owner's report channel. */
          final class Feedback {
              private Feedback() { }

              /** 200 = sent, 503 = not set up, 429 = too many, 400 = too short, -1 = no internet */
              static int send(SharedPreferences p, String type, String text, String contact, String pageUrl, String app) {
                  try {
                      JSONObject o = new JSONObject();
                      o.put("type", type).put("text", text).put("contact", contact == null ? "" : contact)
                              .put("url", pageUrl == null ? "" : pageUrl).put("app", app)
                              .put("device", Build.MANUFACTURER + " " + Build.MODEL + " / Android " + Build.VERSION.RELEASE);
                      HttpURLConnection con = (HttpURLConnection) new URL(Account.BASE + "/ven/report").openConnection();
                      con.setRequestMethod("POST");
                      con.setConnectTimeout(10000);
                      con.setReadTimeout(15000);
                      con.setDoOutput(true);
                      con.setRequestProperty("Content-Type", "application/json");
                      String tok = Account.token(p);
                      if (!tok.isEmpty()) con.setRequestProperty("Authorization", "Bearer " + tok);
                      OutputStream os = con.getOutputStream();
                      os.write(o.toString().getBytes("UTF-8"));
                      os.close();
                      int code = con.getResponseCode();
                      con.disconnect();
                      return code;
                  } catch (Exception e) { return -1; }
              }
          }
          SGB_EOF
          cat > sgb-android/app/src/main/java/app/scamguard/browser/FileScan.java <<'SGB_EOF'
          package app.scamguard.browser;

          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ServiceInfo;
          import android.content.pm.ActivityInfo;
          import android.os.Build;
          import android.os.ParcelFileDescriptor;

          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.MessageDigest;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Enumeration;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Set;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipFile;

          /** Basic on-device check of a downloaded file. It is a heuristic check, not a full antivirus. */
          final class FileScan {
              private FileScan() { }

              static final class Reason {
                  final int lvl;          // 0 info / ok, 1 suspicious, 2 dangerous
                  final String key;
                  final String param;
                  Reason(int l, String k, String p) { lvl = l; key = k; param = p == null ? "" : p; }
              }

              static final class Result {
                  int level;
                  final ArrayList<Reason> reasons = new ArrayList<>();
                  String sha256 = "";
                  long size;
                  void add(int lvl, String key, String param) {
                      if (lvl > level) level = lvl;
                      reasons.add(new Reason(lvl, key, param));
                  }
              }

              private static final Set<String> PLAIN = new HashSet<>(Arrays.asList(
                      "jpg", "jpeg", "png", "gif", "bmp", "webp", "heic", "pdf", "doc", "docx", "xls", "xlsx", "ppt", "pptx",
                      "txt", "mp3", "mp4", "mkv", "avi", "mov", "wav", "m4a", "ogg", "csv"));
              private static final Set<String> OFFICE_ZIP = new HashSet<>(Arrays.asList("docx", "xlsx", "pptx", "docm", "xlsm"));
              private static final String[] EXEC_EXT = {"exe", "scr", "bat", "cmd", "com", "pif", "vbs", "js", "jar", "msi",
                      "lnk", "hta", "ps1", "apk", "xapk", "apks", "dll", "reg"};

              private static boolean isExecExt(String e) {
                  for (String x : EXEC_EXT) if (x.equals(e)) return true;
                  return false;
              }

              static String sniff(byte[] h, int n) {
                  if (n >= 2 && h[0] == 'M' && h[1] == 'Z') return "exe";
                  if (n >= 4 && h[0] == 0x7f && h[1] == 'E' && h[2] == 'L' && h[3] == 'F') return "elf";
                  if (n >= 4 && h[0] == 'P' && h[1] == 'K' && (h[2] == 3 || h[2] == 5)) return "zip";
                  if (n >= 4 && h[0] == '%' && h[1] == 'P' && h[2] == 'D' && h[3] == 'F') return "pdf";
                  if (n >= 4 && (h[0] & 0xff) == 0x89 && h[1] == 'P' && h[2] == 'N' && h[3] == 'G') return "png";
                  if (n >= 3 && (h[0] & 0xff) == 0xFF && (h[1] & 0xff) == 0xD8) return "jpg";
                  if (n >= 3 && h[0] == 'G' && h[1] == 'I' && h[2] == 'F') return "gif";
                  if (n >= 4 && h[0] == 'R' && h[1] == 'a' && h[2] == 'r' && h[3] == '!') return "rar";
                  if (n >= 4 && h[0] == '7' && h[1] == 'z' && (h[2] & 0xff) == 0xBC && (h[3] & 0xff) == 0xAF) return "7z";
                  if (n >= 2 && (h[0] & 0xff) == 0x1f && (h[1] & 0xff) == 0x8b) return "gz";
                  if (n >= 4 && (h[0] & 0xff) == 0xCA && (h[1] & 0xff) == 0xFE && (h[2] & 0xff) == 0xBA && (h[3] & 0xff) == 0xBE) return "class";
                  if (n >= 2 && h[0] == '#' && h[1] == '!') return "script";
                  if (n >= 4 && h[0] == 'd' && h[1] == 'e' && h[2] == 'x' && h[3] == '\n') return "dex";
                  return "unknown";
              }

              private static String hex(byte[] b) {
                  StringBuilder sb = new StringBuilder();
                  for (byte x : b) sb.append(String.format("%02x", x & 0xff));
                  return sb.toString();
              }

              /** Blocking: run on a background thread. */
              static Result scan(Context ctx, DownloadManager dm, long id, String name, String vtKey) {
                  Result r = new Result();
                  File tmp = null;
                  try {
                      if (name == null) name = "";
                      ParcelFileDescriptor pfd = dm.openDownloadedFile(id);
                      InputStream in = new ParcelFileDescriptor.AutoCloseInputStream(pfd);
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      byte[] head = new byte[4096];
                      int headLen = 0;
                      long total = 0;
                      long limit = 300L * 1024 * 1024;
                      tmp = new File(ctx.getCacheDir(), "scan_" + id);
                      OutputStream out = new FileOutputStream(tmp);
                      boolean copying = true;
                      byte[] buf = new byte[65536];
                      int n;
                      while ((n = in.read(buf)) > 0) {
                          md.update(buf, 0, n);
                          if (headLen < head.length) {
                              int c = Math.min(n, head.length - headLen);
                              System.arraycopy(buf, 0, head, headLen, c);
                              headLen += c;
                          }
                          total += n;
                          if (copying) {
                              if (total <= limit) {
                                  out.write(buf, 0, n);
                              } else {
                                  copying = false;
                                  out.close();
                                  tmp.delete();
                              }
                          }
                      }
                      if (copying) out.close();
                      in.close();
                      r.size = total;
                      r.sha256 = hex(md.digest());
                      boolean haveCopy = copying && tmp.exists();

                      String low = name.toLowerCase(Locale.ROOT);
                      int dot = low.lastIndexOf('.');
                      String ext = dot >= 0 ? low.substring(dot + 1) : "";
                      String kind = sniff(head, headLen);

                      // 1) tricks in the file name
                      if (name.indexOf('\u202e') >= 0) r.add(2, "fs_rlo", "");
                      if (low.matches(".*\\.(jpg|jpeg|png|gif|bmp|webp|pdf|docx?|xlsx?|pptx?|txt|mp3|mp4|mkv|avi|zip|rar)\\.(exe|scr|bat|cmd|com|pif|vbs|js|jar|msi|lnk|apk|hta|ps1)$"))
                          r.add(2, "fs_double", name);

                      // 2) the content does not match the name
                      if (PLAIN.contains(ext)) {
                          if (kind.equals("exe") || kind.equals("elf") || kind.equals("class") || kind.equals("dex")) {
                              r.add(2, "fs_disguise", ext + " → " + kind);
                          } else if (kind.equals("script")) {
                              r.add(1, "fs_disguise", ext + " → script");
                          } else if (kind.equals("zip") && !OFFICE_ZIP.contains(ext)) {
                              r.add(1, "fs_disguise", ext + " → zip");
                          }
                      } else if (isExecExt(ext) && !ext.equals("apk") && !ext.equals("xapk") && !ext.equals("apks") && !ext.equals("jar")) {
                          r.add(1, "fs_exec", "." + ext);
                      }

                      // 3) archives / apk / office documents
                      boolean zipLike = kind.equals("zip") && haveCopy;
                      boolean isApk = false;
                      if (zipLike) {
                          ZipFile zf = null;
                          try {
                              zf = new ZipFile(tmp);
                              long unc = 0;
                              int count = 0;
                              boolean hasManifest = false, hasDex = false, macro = false, trav = false;
                              String execInside = null;
                              Enumeration<? extends ZipEntry> en = zf.entries();
                              while (en.hasMoreElements() && count < 8000) {
                                  ZipEntry e = en.nextElement();
                                  count++;
                                  String nm = e.getName();
                                  String ln = nm.toLowerCase(Locale.ROOT);
                                  if (e.getSize() > 0) unc += e.getSize();
                                  if (nm.contains("../") || nm.startsWith("/")) trav = true;
                                  if (ln.equals("androidmanifest.xml")) hasManifest = true;
                                  if (ln.equals("classes.dex")) hasDex = true;
                                  if (ln.endsWith("vbaproject.bin")) macro = true;
                                  int d2 = ln.lastIndexOf('.');
                                  if (execInside == null && d2 >= 0 && !e.isDirectory() && isExecExt(ln.substring(d2 + 1))) execInside = nm;
                              }
                              isApk = hasManifest && hasDex;
                              if (trav) r.add(2, "fs_zip_trav", "");
                              if (macro) r.add(1, "fs_macro", "");
                              if (!isApk && execInside != null && !ext.equals("jar")) r.add(1, "fs_zip_exec", execInside);
                              if (unc > 2000L * 1024 * 1024 && total > 0 && unc / total > 100) r.add(1, "fs_zip_bomb", "");
                              if (isApk && !ext.equals("apk") && !ext.equals("xapk") && !ext.equals("apks"))
                                  r.add(PLAIN.contains(ext) ? 2 : 1, "fs_disguise", ext + " → apk");
                          } catch (Exception e) {
                              // not a readable zip: ignore
                          } finally {
                              try { if (zf != null) zf.close(); } catch (Exception e2) { /* ignore */ }
                          }
                      }
                      if (isApk) apkCheck(ctx, tmp, r);

                      // 4) online hash lookup (optional)
                      if (vtKey != null && !vtKey.trim().isEmpty()) vtCheck(r, vtKey.trim());

                      if (r.reasons.isEmpty()) r.add(0, "fs_clean", "");
                  } catch (Exception e) {
                      r.add(0, "fs_error", String.valueOf(e.getMessage()));
                  } finally {
                      if (tmp != null) tmp.delete();
                  }
                  return r;
              }

              private static boolean has(String[] arr, String perm) {
                  if (arr == null) return false;
                  for (String a : arr) if (perm.equals(a)) return true;
                  return false;
              }

              private static void apkCheck(Context ctx, File f, Result r) {
                  try {
                      PackageManager pm = ctx.getPackageManager();
                      int flags = PackageManager.GET_PERMISSIONS | PackageManager.GET_SERVICES | PackageManager.GET_RECEIVERS;
                      if (Build.VERSION.SDK_INT >= 28) flags |= PackageManager.GET_SIGNING_CERTIFICATES;
                      PackageInfo pi = pm.getPackageArchiveInfo(f.getPath(), flags);
                      if (pi == null) return;
                      String pkg = pi.packageName == null ? "?" : pi.packageName;
                      String[] perms = pi.requestedPermissions;
                      int pc = perms == null ? 0 : perms.length;
                      r.add(0, "fs_apk_info", pkg + " · v" + (pi.versionName == null ? "?" : pi.versionName) + " · " + pc);

                      boolean acc = false, adm = false, notif = false;
                      if (pi.services != null) {
                          for (ServiceInfo s : pi.services) {
                              if ("android.permission.BIND_ACCESSIBILITY_SERVICE".equals(s.permission)) acc = true;
                              if ("android.permission.BIND_NOTIFICATION_LISTENER_SERVICE".equals(s.permission)) notif = true;
                          }
                      }
                      if (pi.receivers != null) {
                          for (ActivityInfo a : pi.receivers) {
                              if ("android.permission.BIND_DEVICE_ADMIN".equals(a.permission)) adm = true;
                          }
                      }
                      boolean sms = has(perms, "android.permission.READ_SMS") || has(perms, "android.permission.RECEIVE_SMS")
                              || has(perms, "android.permission.SEND_SMS") || has(perms, "android.permission.RECEIVE_MMS")
                              || has(perms, "android.permission.RECEIVE_WAP_PUSH");
                      boolean overlay = has(perms, "android.permission.SYSTEM_ALERT_WINDOW");
                      boolean inst = has(perms, "android.permission.REQUEST_INSTALL_PACKAGES");
                      boolean files = has(perms, "android.permission.MANAGE_EXTERNAL_STORAGE");

                      if (acc) r.add(1, "fs_apk_acc", "");
