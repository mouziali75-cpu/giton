              void updateUrlBar() {
                  if (cur == null) return;
                  String[] info = urlInfo();
                  int st = Integer.parseInt(info[2]);
                  if (st == 0) { secIcon.setImageResource(R.drawable.ic_shield); secIcon.setColorFilter(C_ACCENT); }
                  else if (st == 1) { secIcon.setImageResource(R.drawable.ic_info); secIcon.setColorFilter(C_MUTED); }
                  else if (st == 2) { secIcon.setImageResource(R.drawable.ic_shield); secIcon.setColorFilter(C_BAD); }
                  else if (st == 3) { secIcon.setImageResource(R.drawable.ic_lock); secIcon.setColorFilter(C_MUTED); }
                  else { secIcon.setImageResource(R.drawable.ic_info); secIcon.setColorFilter(C_WARN); }
                  secLabel.setVisibility(st == 4 ? View.VISIBLE : View.GONE);
                  if (!urlBox.hasFocus()) {
                      String shown = info[0];
                      int um = prefs.getInt("urlmode", 0);
                      if (um == 1 && cur.title != null && !cur.title.isEmpty() && !cur.url.startsWith(Pages.BASE)) shown = cur.title;
                      else if (um == 2) { String ru = realUrl(); if (ru != null) shown = ru; }
                      urlBox.setText(shown);
                  }
                  if (btnBack != null) {
                      btnBack.setAlpha((backTarget(cur) != 0 || tabs.size() > 1 || cur.web.canGoBack()) ? 1f : 0.35f);
                      btnFwd.setAlpha(cur.web.canGoForward() ? 1f : 0.35f);
                  }
                  updateProgress();
              }

              // ================= tabs =================
              Tab newTab(String url, boolean select) {
                  if (tabs.size() >= 20) {
                      Tab old = tabs.get(0) == cur ? tabs.get(1) : tabs.get(0);
                      closeTab(old);
                  }
                  Tab t = new Tab();
                  t.desktop = prefs.getBoolean("def_desktop", false);
                  t.web = makeWebView(t);
                  t.web.setVisibility(View.GONE);
                  webHolder.addView(t.web, new FrameLayout.LayoutParams(-1, -1));
                  tabs.add(t);
                  t.pending = url;
                  updateTabCount();
                  if (select) switchTo(t);
                  return t;
              }

              void switchTo(Tab t) {
                  if (cur != null && cur != t) captureThumb(cur);
                  for (Tab o : tabs) o.web.setVisibility(o == t ? View.VISIBLE : View.GONE);
                  cur = t;
                  setBars(true);
                  banner.setVisibility(View.GONE);
                  if (!t.started) {
                      if (t.pending != null && !t.pending.isEmpty()) {
                          String p = t.pending;
                          t.pending = null;
                          navigate(t, p, true);
                      } else {
                          t.pending = null;
                          loadHome(t);
                      }
                  }
                  urlBox.clearFocus();
                  updateUrlBar();
              }

              void closeTab(Tab t) {
                  int i = tabs.indexOf(t);
                  if (i < 0) return;
                  tabs.remove(t);
                  webHolder.removeView(t.web);
                  try { t.web.stopLoading(); t.web.destroy(); } catch (Exception e) { /* ignore */ }
                  if (tabs.isEmpty()) {
                      cur = null;
                      newTab(null, true);
                  } else if (cur == t) {
                      Tab o = (t.opener != null && tabs.contains(t.opener)) ? t.opener : null;
                      switchTo(o != null ? o : tabs.get(Math.max(0, i - 1)));
                  }
                  updateTabCount();
              }

              String tabTitle(Tab t) {
                  String u = t.pending != null ? t.pending : t.url;
                  if (u == null || u.isEmpty() || u.startsWith(Pages.BASE + "home")) return S.t("new_tab");
                  if (t.title != null && !t.title.isEmpty()) return t.title;
                  return pretty(u);
              }

              void saveTabs() {
                  if (prefs == null) return;
                  JSONArray a = new JSONArray();
                  for (Tab t : tabs) {
                      String u = t.pending != null ? t.pending : t.url;
                      if (u == null || u.startsWith(Pages.BASE)) u = "";
                      a.put(u);
