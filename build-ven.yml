      - name: Build APK
        working-directory: sgb-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp sgb-android/app/build/outputs/apk/debug/app-debug.apk Ven.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ven-APK
          path: Ven.apk

      - name: Publish release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ven-${{ github.run_number }}
          name: Ven build ${{ github.run_number }}
          files: Ven.apk
