              // ----- view source -----
              void showSource(final String url) {
                  if (!isWeb(url) || url.startsWith(Pages.BASE)) { toast(S.t("no_page")); return; }
                  final Dialog d = newFull();
                  LinearLayout[] sh = shell(d, "view-source:" + pretty(url));
                  final String[] data = new String[2];
                  final int[] mode = {0};
                  final TextView body = new TextView(this);
                  body.setTypeface(Typeface.MONOSPACE);
                  body.setTextSize(11);
                  body.setTextColor(0xFFD6DBE8);
                  body.setPadding(dp(10), dp(8), dp(10), dp(24));
                  body.setTextIsSelectable(true);
                  body.setTextDirection(View.TEXT_DIRECTION_LTR);
                  body.setText(S.t("src_loading"));
                  final ScrollView sv = new ScrollView(this);
                  sv.addView(body);

                  final TextView bRaw = text(S.t("src_raw"), 14, C_ACCENT);
                  final TextView bDom = text(S.t("src_dom"), 14, C_MUTED);
                  bRaw.setPadding(dp(10), dp(8), dp(10), dp(8));
                  bDom.setPadding(dp(10), dp(8), dp(10), dp(8));

                  final Runnable render = new Runnable() {
                      @Override public void run() {
                          bRaw.setTextColor(mode[0] == 0 ? C_ACCENT : C_MUTED);
                          bDom.setTextColor(mode[0] == 1 ? C_ACCENT : C_MUTED);
                          String s = data[mode[0]];
                          if (s == null) { body.setText(S.t("src_loading")); return; }
                          if (s.isEmpty()) { body.setText(S.t("src_fail")); return; }
                          String shown = s;
                          if (s.length() > 300000) { shown = s.substring(0, 300000); toast(S.t("src_cut")); }
                          body.setText(shown, TextView.BufferType.SPANNABLE);
                          sv.scrollTo(0, 0);
                      }
                  };
                  bRaw.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { mode[0] = 0; render.run(); }
                  });
                  bDom.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { mode[0] = 1; render.run(); }
                  });
                  sh[1].addView(bRaw);
                  sh[1].addView(bDom);
                  sh[1].addView(iconBtn(R.drawable.ic_copy, new View.OnClickListener() {
                      @Override public void onClick(View v) {
                          String s = data[mode[0]];
                          if (s != null && !s.isEmpty()) copyText(s);
                      }
                  }), new LinearLayout.LayoutParams(dp(42), dp(42)));

                  // find row
                  LinearLayout fr = new LinearLayout(this);
                  fr.setOrientation(LinearLayout.HORIZONTAL);
                  fr.setGravity(Gravity.CENTER_VERTICAL);
                  fr.setBackgroundColor(C_SHEET);
                  fr.setPadding(dp(12), 0, dp(4), 0);
                  final EditText fe = new EditText(this);
                  fe.setBackground(null);
                  fe.setTextColor(C_TEXT);
                  fe.setHintTextColor(C_MUTED);
                  fe.setHint(S.t("src_find"));
                  fe.setSingleLine(true);
                  fe.setTextSize(14);
                  fe.setImeOptions(EditorInfo.IME_ACTION_SEARCH);
                  fr.addView(fe, new LinearLayout.LayoutParams(0, dp(44), 1f));
                  final int[] pos = {0};
                  final BackgroundColorSpan[] prev = new BackgroundColorSpan[1];
                  final Runnable findNext = new Runnable() {
                      @Override public void run() {
                          String q = fe.getText().toString().toLowerCase();
                          if (q.isEmpty()) return;
                          CharSequence cs = body.getText();
                          if (!(cs instanceof Spannable)) return;
                          Spannable sp = (Spannable) cs;
                          String hay = cs.toString().toLowerCase();
                          int idx = hay.indexOf(q, pos[0]);
                          if (idx < 0) idx = hay.indexOf(q, 0);
                          if (idx < 0) { toast(S.t("src_none")); return; }
                          if (prev[0] != null) sp.removeSpan(prev[0]);
                          prev[0] = new BackgroundColorSpan(0xFFFFD54F);
                          sp.setSpan(prev[0], idx, idx + q.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                          pos[0] = idx + 1;
                          Layout l = body.getLayout();
                          if (l != null) {
                              int line = l.getLineForOffset(idx);
                              sv.smoothScrollTo(0, Math.max(0, l.getLineTop(line) - dp(80)));
                          }
                      }
                  };
                  fe.addTextChangedListener(new TextWatcher() {
                      @Override public void beforeTextChanged(CharSequence s, int a, int b, int c) { }
                      @Override public void onTextChanged(CharSequence s, int a, int b, int c) { pos[0] = 0; }
                      @Override public void afterTextChanged(Editable e) { }
                  });
                  fe.setOnEditorActionListener(new TextView.OnEditorActionListener() {
                      @Override public boolean onEditorAction(TextView v, int id, KeyEvent ev) {
                          findNext.run();
                          return true;
                      }
                  });
                  fr.addView(iconBtn(R.drawable.ic_down, new View.OnClickListener() {
                      @Override public void onClick(View v) { findNext.run(); }
                  }), new LinearLayout.LayoutParams(dp(40), dp(40)));
                  sh[0].addView(fr, new LinearLayout.LayoutParams(-1, -2));
                  sh[0].addView(sv, new LinearLayout.LayoutParams(-1, 0, 1f));
                  render.run();
                  showFull(d);

                  // rendered DOM (from the live tab)
                  if (cur != null && url.equals(cur.web.getUrl())) {
                      cur.web.evaluateJavascript("document.documentElement.outerHTML", new ValueCallback<String>() {
                          @Override public void onReceiveValue(String v) {
                              try {
                                  Object o = new JSONTokener(v).nextValue();
                                  data[1] = o instanceof String ? (String) o : "";
                              } catch (Exception e) { data[1] = ""; }
                              if (mode[0] == 1) render.run();
                          }
                      });
                  }
                  // raw source (network)
                  final String ua = cur != null && cur.desktop ? DESKTOP_UA : mobileUa;
                  new Thread(new Runnable() {
                      @Override public void run() {
                          String raw = "";
                          try {
                              HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                              c.setConnectTimeout(10000);
                              c.setReadTimeout(15000);
                              c.setRequestProperty("User-Agent", ua);
                              String ck = CookieManager.getInstance().getCookie(url);
                              if (ck != null) c.setRequestProperty("Cookie", ck);
                              InputStream in = c.getInputStream();
                              ByteArrayOutputStream bo = new ByteArrayOutputStream();
                              byte[] buf = new byte[16384];
                              int n;
                              while ((n = in.read(buf)) > 0 && bo.size() < 4 * 1024 * 1024) bo.write(buf, 0, n);
                              in.close();
                              raw = new String(bo.toByteArray(), StandardCharsets.UTF_8);
                          } catch (Exception e) { raw = ""; }
                          final String fin = raw;
                          ui.post(new Runnable() {
                              @Override public void run() {
                                  data[0] = fin;
                                  if (fin.isEmpty() && data[1] != null && !data[1].isEmpty() && mode[0] == 0) mode[0] = 1;
                                  render.run();
                              }
                          });
                      }
                  }).start();
              }

