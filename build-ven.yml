              // ================= navigation =================
              void load(final Tab t, final String url) {
                  ui.post(new Runnable() { @Override public void run() { t.started = true; t.web.loadUrl(url); } });
              }

              void loadHome(Tab t) {
                  t.started = true;
                  t.web.loadUrl(Pages.BASE + "home");
              }

              void go(String in) {
                  in = in.trim();
                  if (in.toLowerCase().startsWith("view-source:")) { showSource(in.substring(12)); return; }
                  if (cur == null) return;
                  String u = fixInput(in);
                  if (u.isEmpty()) loadHome(cur);
                  else navigate(cur, u, true);
              }

              String fixInput(String in) {
                  if (in.isEmpty()) return "";
                  String low = in.toLowerCase();
                  if (low.startsWith("http://") || low.startsWith("https://")) return in;
                  if (low.startsWith("javascript:") || low.startsWith("file:") || low.startsWith("content:")
                          || low.startsWith("intent:") || low.startsWith("data:")) return searchUrl(in);
                  if (low.startsWith("localhost")) return "http://" + in;
                  if (!in.contains(" ") && in.contains(".") && !in.startsWith(".") && !in.endsWith(".")) return "https://" + in;
                  return searchUrl(in);
              }

              String searchUrl(String q) {
                  String e = Pages.enc(q);
                  if ("duckduckgo".equals(sEngine)) return "https://duckduckgo.com/?q=" + e + (sNsfw ? "&kp=1" : "");
                  if ("bing".equals(sEngine)) return "https://www.bing.com/search?q=" + e + (sNsfw ? "&adlt=strict" : "");
                  if ("brave".equals(sEngine)) return "https://search.brave.com/search?q=" + e + (sNsfw ? "&safesearch=strict" : "");
                  return "https://www.google.com/search?q=" + e + (sNsfw ? "&safe=active" : "");
              }

              void navigate(Tab t, String url, boolean typed) {
                  t.typed = typed;
                  t.started = true;
                  if (url == null || url.isEmpty()) { loadHome(t); return; }
                  if (guard(t, url, typed)) return;
                  t.web.loadUrl(url);
              }

              boolean blockCheck(Tab t, String url, String host) {
                  if (!(sAnti || sNsfw)) return false;
                  Shield.Result r = Shield.check(host, url, sNsfw);
                  if (!r.hard || allowed.contains(host)) return false;
                  boolean adult = "adult".equals(r.category);
                  if (adult ? !sNsfw : !sAnti) return false;
                  if (off(host) && !adult) return false;
                  threatsBlocked++;
                  load(t, Pages.BASE + "blocked?u=" + Pages.enc(url));
                  return true;
              }

              /** true = navigation was handled (blocked / redirected), do not load it again */
              boolean guard(Tab t, String url, boolean typed) {
                  Uri u = Uri.parse(url);
                  String sch = u.getScheme() == null ? "" : u.getScheme().toLowerCase();
                  String host = u.getHost() == null ? "" : u.getHost().toLowerCase();
                  if (host.equals(Pages.HOST)) return false;
                  if (!(sch.equals("http") || sch.equals("https"))) return false;
                  if (sNoPay && !off(host) && Shield.isPayment(url, host)) {
                      threatsBlocked++;
                      toast(S.t("pay_blocked"));
                      load(t, Pages.BASE + "blocked?u=" + Pages.enc(url) + "&p=1");
                      return true;
                  }
                  if (sStrip && !relaxed(host)) {
                      String clean = stripTracking(url);
                      if (!clean.equals(url)) { t.web.loadUrl(clean); return true; }
                  }
                  if (!typed && adsOn(t.url) && Shield.isAd(host)) {
                      adsBlocked++;
                      toast(S.t("ad_redirect"));
                      if (t.popup) closeLater(t);
                      return true;
                  }
                  if (blockCheck(t, url, host)) return true;
                  if (sHttps && sch.equals("http") && !t.skipUpgrade && !host.equals("localhost")
                          && !host.matches("[0-9.]+") && !host.endsWith(".local")) {
                      String https = "https" + url.substring(4);
                      t.upFrom = url;
                      t.upTo = https;
                      load(t, https);
                      return true;
                  }
                  return false;
              }

              // ---- back that skips pages which bounced on by themselves (ad / tracker redirect hops) ----
              int backTarget(Tab t) {
                  try {
                      WebBackForwardList l = t.web.copyBackForwardList();
                      int ci = l.getCurrentIndex();
                      for (int i = ci - 1; i >= 0; i--) {
                          String u = l.getItemAtIndex(i).getUrl();
                          if (u == null || !t.hops.contains(u)) return i - ci;
                      }
                  } catch (Exception e) { /* no history */ }
                  return 0;
              }

              boolean goBackSmart(Tab t) {
                  int off = backTarget(t);
                  if (off == 0) return false;
                  t.web.goBackOrForward(off);
                  return true;
              }

              static String regDomain(String h) {
                  if (h == null) return "";
                  String[] p = h.split("\\.");
                  int n = p.length;
                  if (n <= 2) return h;
                  String last = p[n - 1], sec = p[n - 2];
                  if (last.length() == 2 && (sec.equals("co") || sec.equals("com") || sec.equals("org") || sec.equals("net")
                          || sec.equals("gov") || sec.equals("edu") || sec.equals("ac"))) return p[n - 3] + "." + sec + "." + last;
                  return sec + "." + last;
              }

              /** A page that navigates away by itself (no tap, not a server redirect). true = blocked. */
              boolean autoRedirect(Tab t, WebResourceRequest req) {
                  if (req.hasGesture() || req.isRedirect()) return false;
                  String cu = t.url;
                  if (!isWeb(cu) || cu.startsWith(Pages.BASE)) return false;
                  Uri nu = req.getUrl();
                  if (!isWeb(nu.toString())) return false;
                  String nh = nu.getHost() == null ? "" : nu.getHost().toLowerCase();
                  if (nh.equals(Pages.HOST)) return false;
                  long age = System.currentTimeMillis() - t.pageStart;
                  if (age < 2500) { t.hops.add(cu); return false; }      // quick bounce page (link shortener, tracker): allowed, "back" skips it
                  if (!sNoRedirect) { if (age < 6000) t.hops.add(cu); return false; }
                  Uri cp = Uri.parse(cu);
                  String ch = cp.getHost() == null ? "" : cp.getHost().toLowerCase();
                  if (regDomain(ch).equals(regDomain(nh)) || Shield.isTrusted(nh) || relaxed(ch)) return false;
                  Tab nt = newTab(nu.toString(), false);     // the redirect gets its own tab; this page stays where it is
                  nt.opener = t;
                  toast(S.t("redirect_tab").replace("{h}", nh));
                  return true;
              }

              static final String[] TRACK_PREFIX = {"utm_", "mtm_", "pk_"};
              static final String[] TRACK_KEYS = {"fbclid", "gclid", "dclid", "gbraid", "wbraid", "msclkid", "yclid", "mc_eid", "mc_cid",
                      "igshid", "twclid", "ttclid", "li_fat_id", "_hsenc", "_hsmi", "vero_id", "oly_enc_id", "oly_anon_id", "s_cid"};

              static String stripTracking(String url) {
                  try {
                      int qi = url.indexOf('?');
                      if (qi < 0) return url;
                      int hi = url.indexOf('#', qi);
                      String frag = hi < 0 ? "" : url.substring(hi);
                      String query = hi < 0 ? url.substring(qi + 1) : url.substring(qi + 1, hi);
                      StringBuilder keep = new StringBuilder();
                      boolean removed = false;
                      for (String part : query.split("&")) {
                          if (part.isEmpty()) continue;
                          int eq = part.indexOf('=');
                          String key = (eq >= 0 ? part.substring(0, eq) : part).toLowerCase(Locale.ROOT);
                          boolean track = false;
                          for (String pf : TRACK_PREFIX) if (key.startsWith(pf)) track = true;
                          for (String k : TRACK_KEYS) if (key.equals(k)) track = true;
                          if (track) { removed = true; continue; }
                          if (keep.length() > 0) keep.append('&');
                          keep.append(part);
                      }
                      if (!removed) return url;
                      return url.substring(0, qi) + (keep.length() > 0 ? "?" + keep : "") + frag;
                  } catch (Exception e) { return url; }
              }

              void closeLater(final Tab t) {
                  ui.post(new Runnable() { @Override public void run() { closeTab(t); } });
              }

              boolean handleNav(Tab t, String url, boolean gesture) {
                  Uri u = Uri.parse(url);
                  String sch = u.getScheme() == null ? "" : u.getScheme().toLowerCase();
                  String host = u.getHost() == null ? "" : u.getHost().toLowerCase();
                  if (Pages.HOST.equals(host)) {
                      String path = u.getPath() == null ? "" : u.getPath();
                      if (path.equals("/leave")) { leave(t); return true; }
                      if (path.equals("/continue")) { confirmContinue(t, u.getQueryParameter("u")); return true; }
                      if (path.equals("/retry")) {
                          String r = u.getQueryParameter("u");
                          if (r != null) navigate(t, r, true);
                          return true;
                      }
                      if (path.equals("/search")) {
                          String q = u.getQueryParameter("q");
                          if (q != null) navigate(t, fixInput(q.trim()), true);
                          return true;
                      }
                      return false;
                  }
                  if (sch.equals("http") || sch.equals("https")) return guard(t, url, false);
                  if (sch.isEmpty() || sch.equals("about") || sch.equals("data") || sch.equals("blob") || sch.equals("javascript")) return false;
                  if (sch.equals("file") || sch.equals("content") || sch.equals("intent") || sch.equals("market")) {
                      toast(S.t("blocked_app"));
                      return true;
                  }
                  boolean okScheme = sch.equals("tel") || sch.equals("mailto") || sch.equals("sms") || sch.equals("geo")
                          || sch.equals("whatsapp") || sch.equals("tg") || sch.equals("discord");
                  if (gesture && okScheme) {
                      try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { toast(S.t("blocked_app")); }
                  } else {
                      toast(S.t("blocked_app"));
                  }
                  return true;
              }

              void leave(Tab t) {
                  if (goBackSmart(t)) { /* went back */ }
                  else if ((t.popup || t.opener != null) && tabs.size() > 1) closeLater(t);
                  else loadHome(t);
              }

              void confirmContinue(final Tab t, final String url) {
                  if (url == null) return;
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(S.t("warn_disc_title"))
                          .setMessage(S.t("warn_disc"))
                          .setNegativeButton(S.t("warn_leave_site"), new android.content.DialogInterface.OnClickListener() {
                              @Override public void onClick(android.content.DialogInterface d, int w) { leave(t); }
                          })
                          .setPositiveButton(S.t("warn_ok"), new android.content.DialogInterface.OnClickListener() {
                              @Override public void onClick(android.content.DialogInterface d, int w) {
                                  Uri u = Uri.parse(url);
                                  if (u.getHost() != null) allowed.add(u.getHost().toLowerCase());
                                  navigate(t, url, true);
                              }
                          }).show();
              }

              // ================= WebView =================
              void applySettings(WebView w, Tab t) {
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setSupportMultipleWindows(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(!sPopups);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setAllowFileAccessFromFileURLs(false);
                  s.setAllowUniversalAccessFromFileURLs(false);
                  s.setMediaPlaybackRequiresUserGesture(true);
                  s.setSupportZoom(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  s.setSafeBrowsingEnabled(true);
                  s.setTextZoom(sText);
                  boolean noimg = prefs.getBoolean("noimg", false);
                  s.setLoadsImagesAutomatically(!noimg);
                  s.setBlockNetworkImage(noimg);
                  WebView.setWebContentsDebuggingEnabled(prefs.getBoolean("webdebug", false));
                  if (Build.VERSION.SDK_INT >= 29) s.setForceDark(sDarkWeb ? WebSettings.FORCE_DARK_ON : WebSettings.FORCE_DARK_OFF);
                  String uam = prefs.getString("ua_mode", "def");
                  String uaStr = mobileUa;
                  if ("win".equals(uam)) uaStr = WIN_UA;
                  else if ("iphone".equals(uam)) uaStr = IPHONE_UA;
                  else if ("custom".equals(uam) && !prefs.getString("ua_custom", "").isEmpty()) uaStr = prefs.getString("ua_custom", "");
                  s.setUserAgentString(t.desktop ? DESKTOP_UA : uaStr);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, !s3p);
              }

              void applyAllSettings() {
                  for (Tab t : tabs) applySettings(t.web, t);
                  applyOrientation();
              }

              WebResourceResponse empty(int code) {
                  return new WebResourceResponse("text/plain", "utf-8", code, code == 200 ? "OK" : "Not Found",
                          new HashMap<String, String>(), new ByteArrayInputStream(new byte[0]));
              }

              WebResourceResponse internalPage(Uri u) {
                  String path = u.getPath() == null ? "" : u.getPath();
                  String html = null;
                  if (path.equals("/home")) {
                      html = Pages.home(adsBlocked, threatsBlocked);
                  } else if (path.equals("/blocked")) {
                      String url = u.getQueryParameter("u");
                      if (url == null) url = "";
                      Uri p = Uri.parse(url);
                      String host = p.getHost() == null ? "" : p.getHost();
                      Shield.Result r = Shield.check(host, url, true);
                      html = Pages.blocked(url, r, false);
                      if (u.getQueryParameter("p") != null) {
                          Shield.Result r3 = new Shield.Result();
                          r3.category = "payment";
                          r3.flags.add(new String[]{"flag_payment", ""});
                          html = Pages.blocked(url, r3, false);
                      }
                      if (u.getQueryParameter("r") != null) {
                          Shield.Result r2 = new Shield.Result();
                          r2.category = "adult";
                          html = Pages.blocked(url, r2, true);
                      }
                  } else if (path.equals("/error")) {
                      String url = u.getQueryParameter("u");
                      String d = u.getQueryParameter("d");
                      html = Pages.error(url == null ? "" : url, d == null ? "" : d, u.getQueryParameter("ssl") != null);
                  }
                  if (html == null) return empty(404);
                  Map<String, String> h = new HashMap<>();
                  h.put("Cache-Control", "no-store");
                  return new WebResourceResponse("text/html", "utf-8", 200, "OK", h,
                          new ByteArrayInputStream(html.getBytes(StandardCharsets.UTF_8)));
              }

              WebView makeWebView(final Tab t) {
                  WebView w = new WebView(this);
                  w.setBackgroundColor(C_BG);
                  applySettings(w, t);

                  w.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest req) {
                          Uri u = req.getUrl();
                          String host = u.getHost();
                          if (host != null && host.equals(Pages.HOST)) return internalPage(u);
                          if (sNoPay && host != null && !off(host) && !off(hostOfUrl(t.url)) && Shield.isPayment(u.toString(), host.toLowerCase())) {
                              if (!req.isForMainFrame()) return empty(403);
                              threatsBlocked++;
                              Shield.Result pr = new Shield.Result();
                              pr.category = "payment";
                              pr.flags.add(new String[]{"flag_payment", ""});
                              return new WebResourceResponse("text/html", "utf-8", 200, "OK", new HashMap<String, String>(),
                                      new ByteArrayInputStream(Pages.blocked(u.toString(), pr, false).getBytes(StandardCharsets.UTF_8)));
                          }
                          if (host != null && !req.isForMainFrame() && adsOn(t.url) && Shield.isAd(host.toLowerCase())) {
                              adsBlocked++;
                              logNet(t, "✖ " + u.toString());
                              return empty(200);
                          }
                          logNet(t, u.toString());
                          return null;
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest req) {
                          if (!req.isForMainFrame()) return false;
                          if (autoRedirect(t, req)) return true;
                          return handleNav(t, req.getUrl().toString(), req.hasGesture());
                      }

                      @Override
                      public void onPageStarted(WebView v, String url, Bitmap fav) {
                          t.pageStart = System.currentTimeMillis();
                          t.url = url == null ? "" : url;
                          t.title = "";
                          if (isWeb(url) && !url.startsWith(Pages.BASE)) {
                              Uri u = Uri.parse(url);
                              String host = u.getHost() == null ? "" : u.getHost().toLowerCase();
                              CookieManager.getInstance().setAcceptThirdPartyCookies(v, !s3p || relaxed(host));
                              injectPriv(v);
                              runScripts(v, url, true);
                              if (blockCheck(t, url, host)) v.stopLoading();
                          }
                          if (t == cur) { updateUrlBar(); banner.setVisibility(View.GONE); }
                      }

                      @Override
                      public void doUpdateVisitedHistory(WebView v, String url, boolean isReload) {
                          if (url != null) t.url = url;
                          if (t == cur) updateUrlBar();
                      }

                      @Override
                      public void onPageCommitVisible(WebView v, String url) {
                          if (t.desktop && isWeb(url) && !url.startsWith(Pages.BASE)) v.evaluateJavascript(DESKTOP_JS, null);
                          if (sNoPay && isWeb(url) && !url.startsWith(Pages.BASE) && !off(hostOfUrl(url))) v.evaluateJavascript(PAY_JS, null);
                      }

                      @Override
                      public void onPageFinished(WebView v, String url) {
                          t.progress = 100;
                          t.skipUpgrade = false;
                          t.upFrom = null;
                          t.upTo = null;
                          if (t == cur) updateUrlBar();
                          if (url == null || url.startsWith(Pages.BASE) || !isWeb(url)) return;
                          addHistory(t.title, url);
                          if (hostOfUrl(url).equals("ticoo.wispbyte.org") && System.currentTimeMillis() - ownerChecked > 4000) checkOwner();
                          if (t.desktop) v.evaluateJavascript(DESKTOP_JS, null);
                          if (sNoPay && !off(hostOfUrl(url))) v.evaluateJavascript(PAY_JS, null);
                          if (adsOn(url)) v.evaluateJavascript(AD_JS, null);
                          injectPriv(v);
                          runScripts(v, url, true);
                          runScripts(v, url, false);
                          v.evaluateJavascript(SCAN_JS, new ValueCallback<String>() {
                              @Override public void onReceiveValue(String value) { analyze(t, value); }
                          });
                      }

                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest req, WebResourceError err) {
                          if (!req.isForMainFrame()) return;
                          final String failing = req.getUrl().toString();
                          if (Pages.HOST.equals(req.getUrl().getHost())) return;
                          String desc = String.valueOf(err.getDescription());
                          if (t.upTo != null && t.upTo.equals(failing)) {
                              final String o = t.upFrom;
                              t.upFrom = null;
                              t.upTo = null;
                              t.skipUpgrade = true;
                              load(t, o);
                              return;
                          }
                          if (desc.contains("ERR_ABORTED")) return;
                          load(t, Pages.BASE + "error?u=" + Pages.enc(failing) + "&d=" + Pages.enc(desc));
                      }

