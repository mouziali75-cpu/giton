              void showFeedback(String presetType, String presetUrl) {
                  final Dialog d = newFull();
                  LinearLayout[] sh = shell(d, S.t("fb_title"));
                  LinearLayout p = new LinearLayout(this);
                  p.setOrientation(LinearLayout.VERTICAL);
                  p.setPadding(dp(16), dp(14), dp(16), dp(30));
                  ScrollView sv = new ScrollView(this);
                  sv.addView(p);
                  sh[0].addView(sv, new LinearLayout.LayoutParams(-1, 0, 1f));
                  final String[] keys = {"bug", "idea", "site", "other"};
                  final String[] labels = {S.t("fb_bug"), S.t("fb_idea"), S.t("fb_site"), S.t("fb_other")};
                  final int[] sel = {0};
                  for (int i = 0; i < keys.length; i++) if (keys[i].equals(presetType)) sel[0] = i;
                  final TextView[] chips = new TextView[4];
                  final Runnable paint = new Runnable() {
                      @Override public void run() {
                          for (int i = 0; i < chips.length; i++) {
                              chips[i].setBackground(rounded(i == sel[0] ? C_ACCENT : C_PILL, 18));
                              chips[i].setTextColor(i == sel[0] ? 0xFFFFFFFF : C_TEXT);
                          }
                      }
                  };
                  for (int r = 0; r < 2; r++) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      for (int c = 0; c < 2; c++) {
                          final int idx = r * 2 + c;
                          TextView ch = text(labels[idx], 14, C_TEXT);
                          ch.setGravity(Gravity.CENTER);
                          ch.setPadding(dp(8), dp(11), dp(8), dp(11));
                          ch.setOnClickListener(new View.OnClickListener() {
                              @Override public void onClick(View v) { sel[0] = idx; paint.run(); }
                          });
                          chips[idx] = ch;
                          LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, -2, 1f);
                          lp.setMargins(dp(4), dp(4), dp(4), dp(4));
                          row.addView(ch, lp);
                      }
                      p.addView(row, new LinearLayout.LayoutParams(-1, -2));
                  }
                  paint.run();
                  final EditText msg = field(S.t("fb_msg_hint"), true);
                  final EditText contact = field(S.t("fb_contact_hint"), false);
                  contact.setText(prefs.getString("acc_name", ""));
                  final EditText link = field(S.t("fb_url_hint"), false);
                  link.setText(presetUrl == null ? "" : presetUrl);
                  LinearLayout.LayoutParams fl = new LinearLayout.LayoutParams(-1, -2);
                  fl.setMargins(dp(4), dp(12), dp(4), 0);
                  p.addView(msg, fl);
                  p.addView(contact, fl);
                  p.addView(link, fl);
                  final TextView send = text(S.t("fb_send"), 16, 0xFFFFFFFF);
                  send.setGravity(Gravity.CENTER);
                  send.setBackground(rounded(C_ACCENT, 14));
                  send.setPadding(dp(10), dp(14), dp(10), dp(14));
                  send.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) {
                          final String m = msg.getText().toString().trim();
                          if (m.length() < 5) { toast(S.t("fb_short")); return; }
                          send.setEnabled(false);
                          final String type = keys[sel[0]], ct = contact.getText().toString().trim(), lk = link.getText().toString().trim();
                          new Thread(new Runnable() {
                              @Override public void run() {
                                  final int code = Feedback.send(prefs, type, m, ct, lk, "Ven " + VERSION);
                                  ui.post(new Runnable() {
                                      @Override public void run() {
                                          send.setEnabled(true);
                                          if (code == 200) { toast(S.t("fb_sent")); d.dismiss(); }
                                          else toast(S.t(code == 503 ? "fb_off" : code == 429 ? "fb_slow" : "fb_fail"));
                                      }
                                  });
                              }
                          }).start();
                      }
                  });
                  LinearLayout.LayoutParams sl = new LinearLayout.LayoutParams(-1, -2);
                  sl.setMargins(dp(4), dp(18), dp(4), 0);
                  p.addView(send, sl);
                  showFull(d);
              }

