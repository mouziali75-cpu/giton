              private static void load(String l, HashMap<String, String> m) {
                  if (l.equals("es")) d_es(m);
                  else if (l.equals("pt")) d_pt(m);
                  else if (l.equals("de")) d_de(m);
                  else if (l.equals("it")) d_it(m);
                  else if (l.equals("ru")) d_ru(m);
                  else if (l.equals("tr")) d_tr(m);
                  else if (l.equals("id")) d_id(m);
                  else if (l.equals("hi")) d_hi(m);
                  else if (l.equals("zh")) d_zh(m);
                  else if (l.equals("ja")) d_ja(m);
                  else if (l.equals("ko")) d_ko(m);
                  else if (l.equals("fa")) d_fa(m);
              }

