              /** returns {shownText, rawUrl, state} state: 0 home,1 error,2 blocked,3 https,4 http */
              String[] urlInfo() {
                  String u = cur == null ? "" : cur.url;
                  if (u == null || u.isEmpty()) return new String[]{"", "", "0"};
                  Uri p = Uri.parse(u);
                  if (Pages.HOST.equals(p.getHost())) {
                      String path = p.getPath() == null ? "" : p.getPath();
                      String q = p.getQueryParameter("u");
                      if (path.startsWith("/blocked")) return new String[]{pretty(q), q == null ? "" : q, "2"};
                      if (path.startsWith("/error")) return new String[]{pretty(q), q == null ? "" : q, "1"};
                      return new String[]{"", "", "0"};
                  }
                  return new String[]{pretty(u), u, u.startsWith("https://") ? "3" : "4"};
              }

