              void dlTrack(long id, String name, String url) {
                  try {
                      JSONObject o = new JSONObject();
                      o.put("id", id);
                      o.put("name", name);
                      o.put("url", url);
                      o.put("t", System.currentTimeMillis());
                      prefs.edit().putString("dl_list", prepend(getArr("dl_list"), o, 200).toString()).apply();
                  } catch (Exception e) { /* ignore */ }
              }

              boolean dlTracked(long id) {
                  JSONArray a = getArr("dl_list");
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.optJSONObject(i);
                      if (o != null && o.optLong("id", -1) == id) return true;
                  }
                  return false;
              }

              void dlUntrack(long id) {
                  JSONArray a = getArr("dl_list");
                  JSONArray n = new JSONArray();
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.optJSONObject(i);
                      if (o != null && o.optLong("id", -1) != id) n.put(o);
                  }
                  prefs.edit().putString("dl_list", n.toString()).apply();
              }

              static String fmtSize(long b) {
                  if (b < 0) return "?";
                  if (b < 1024) return b + " B";
                  if (b < 1024L * 1024) return String.format(Locale.US, "%.0f KB", b / 1024.0);
                  if (b < 1024L * 1024 * 1024) return String.format(Locale.US, "%.1f MB", b / 1048576.0);
                  return String.format(Locale.US, "%.2f GB", b / 1073741824.0);
              }

              String reasonText(FileScan.Reason x) {
                  return S.t(x.key).replace("{p}", x.param);
              }

              void openDownload(long id) {
                  DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                  Uri u = dm.getUriForDownloadedFile(id);
                  String mime = dm.getMimeTypeForDownloadedFile(id);
                  if (u == null) { toast(S.t("dl_missing")); return; }
                  Intent i = new Intent(Intent.ACTION_VIEW);
                  i.setDataAndType(u, mime == null ? "*/*" : mime);
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                  try { startActivity(i); } catch (Exception e) { toast(S.t("dl_noapp")); }
              }

              void scanDownload(final long id) {
                  final DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                  String nm = "";
                  int status = -1;
                  android.database.Cursor c = dm.query(new DownloadManager.Query().setFilterById(id));
                  try {
                      if (c != null && c.moveToFirst()) {
                          nm = c.getString(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TITLE));
                          status = c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                      }
                  } finally {
                      if (c != null) c.close();
                  }
                  if (status != DownloadManager.STATUS_SUCCESSFUL) return;
                  final String fname = nm == null ? "" : nm;
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.HORIZONTAL);
                  box.setGravity(Gravity.CENTER_VERTICAL);
                  box.setPadding(dp(22), dp(16), dp(22), dp(8));
                  box.addView(new ProgressBar(this), new LinearLayout.LayoutParams(dp(36), dp(36)));
                  TextView msg = text(S.t("scan_wait"), 15, C_TEXT);
                  msg.setPadding(dp(16), 0, 0, 0);
                  box.addView(msg, new LinearLayout.LayoutParams(0, -2, 1f));
                  final AlertDialog wait = new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(S.t("scan_title") + ": " + fname).setView(box).setCancelable(false).create();
                  wait.show();
                  final String vt = prefs.getString("vt_key", "");
                  new Thread(new Runnable() {
                      @Override public void run() {
                          final FileScan.Result res = FileScan.scan(MainActivity.this, dm, id, fname, vt);
                          ui.post(new Runnable() {
                              @Override public void run() {
                                  try { wait.dismiss(); } catch (Exception e) { /* ignore */ }
                                  if (isFinishing() || isDestroyed()) return;
                                  prefs.edit().putInt("dl_scan_" + id, res.level + 1).apply();
                                  showScanResult(id, fname, res);
                              }
                          });
                      }
                  }).start();
              }

              void showScanResult(final long id, String name, FileScan.Result r) {
                  final DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(22), dp(14), dp(22), dp(4));
                  int col = r.level == 2 ? C_BAD : r.level == 1 ? C_WARN : C_OK;
                  TextView h = text(S.t(r.level == 2 ? "scan_bad_t" : r.level == 1 ? "scan_sus_t" : "scan_clean_t"), 18, col);
                  h.setTypeface(Typeface.DEFAULT_BOLD);
                  box.addView(h);
                  TextView fn = text(name + " · " + fmtSize(r.size), 12, C_MUTED);
                  fn.setPadding(0, dp(2), 0, dp(8));
                  box.addView(fn);
                  for (FileScan.Reason x : r.reasons) {
                      String mark = x.lvl == 2 ? "⛔ " : x.lvl == 1 ? "⚠️ " : "• ";
                      TextView t = text(mark + reasonText(x), 14, x.lvl == 2 ? C_BAD : x.lvl == 1 ? C_WARN : C_TEXT);
                      t.setPadding(0, dp(3), 0, dp(3));
                      box.addView(t);
                  }
                  if (!r.sha256.isEmpty()) {
                      TextView hs = text("SHA-256: " + r.sha256, 10, C_MUTED);
                      hs.setPadding(0, dp(10), 0, 0);
                      hs.setTextIsSelectable(true);
                      box.addView(hs);
                  }
                  TextView note = text(S.t("scan_note"), 11, C_MUTED);
                  note.setPadding(0, dp(8), 0, 0);
                  box.addView(note);
                  ScrollView sv = new ScrollView(this);
                  sv.addView(box);
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setView(sv)
                          .setPositiveButton(S.t(r.level == 0 ? "scan_open" : "scan_open_anyway"), new android.content.DialogInterface.OnClickListener() {
                              @Override public void onClick(android.content.DialogInterface di, int w) { openDownload(id); }
                          })
                          .setNegativeButton(S.t("scan_delete"), new android.content.DialogInterface.OnClickListener() {
                              @Override public void onClick(android.content.DialogInterface di, int w) { dm.remove(id); dlUntrack(id); }
                          })
                          .setNeutralButton(S.t("scan_keep"), null)
                          .show();
              }

              void downloadActions(final long id, String nm, final String url, int st, final Runnable refresh) {
                  final DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                  final int kind = st == DownloadManager.STATUS_SUCCESSFUL ? 0
                          : (st == -1 || st == DownloadManager.STATUS_FAILED) ? 1 : 2;
                  String[] items;
                  if (kind == 0) items = new String[]{S.t("scan_open"), S.t("dl_scan_now"), S.t("copy_link"), S.t("scan_delete")};
                  else if (kind == 1) items = new String[]{S.t("dl_remove")};
                  else items = new String[]{S.t("dl_cancel")};
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(nm)
                          .setItems(items, new android.content.DialogInterface.OnClickListener() {
                              @Override public void onClick(android.content.DialogInterface di, int which) {
                                  if (kind == 0) {
                                      if (which == 0) {
                                          if (prefs.getBoolean("scandl", true) && prefs.getInt("dl_scan_" + id, 0) == 0) scanDownload(id);
                                          else openDownload(id);
                                      } else if (which == 1) {
                                          scanDownload(id);
                                      } else if (which == 2) {
                                          copyText(url);
                                      } else {
                                          dm.remove(id);
                                          dlUntrack(id);
                                          refresh.run();
                                      }
                                  } else {
                                      dm.remove(id);
                                      dlUntrack(id);
                                      refresh.run();
                                  }
                              }
                          }).show();
              }

              void showDownloads() {
                  final Dialog d = newFull();
                  LinearLayout[] sh = shell(d, S.t("downloads"));
                  final LinearLayout list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  ScrollView sv = new ScrollView(this);
                  sv.addView(list);
                  sh[0].addView(sv, new LinearLayout.LayoutParams(-1, 0, 1f));
                  final DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                  final Runnable[] fill = new Runnable[1];
                  fill[0] = new Runnable() {
                      @Override public void run() {
                          if (!d.isShowing()) return;
                          list.removeAllViews();
                          JSONArray a = getArr("dl_list");
                          if (a.length() == 0) {
                              TextView e = text(S.t("dl_empty"), 15, C_MUTED);
                              e.setGravity(Gravity.CENTER);
                              e.setPadding(0, dp(60), 0, 0);
                              list.addView(e, new LinearLayout.LayoutParams(-1, -2));
                              return;
                          }
                          boolean running = false;
                          for (int i = 0; i < a.length(); i++) {
                              JSONObject o = a.optJSONObject(i);
                              if (o == null) continue;
                              final long id = o.optLong("id", -1);
                              final String nm = o.optString("name");
                              final String url = o.optString("url");
                              int status = -1;
                              long tot = -1, got = 0;
                              android.database.Cursor c = dm.query(new DownloadManager.Query().setFilterById(id));
                              try {
                                  if (c != null && c.moveToFirst()) {
                                      status = c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                                      tot = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES));
                                      got = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR));
                                  }
                              } finally {
                                  if (c != null) c.close();
                              }
                              final int st = status;
                              String line;
                              int lineColor = C_MUTED;
                              int pct = 0;
                              if (st == -1) {
                                  line = S.t("dl_missing");
                              } else if (st == DownloadManager.STATUS_SUCCESSFUL) {
                                  int lv = prefs.getInt("dl_scan_" + id, 0);
                                  line = S.t("dl_done") + " · " + fmtSize(tot) + " · "
                                          + S.t(lv == 0 ? "scan_b_none" : lv == 1 ? "scan_b_ok" : lv == 2 ? "scan_b_sus" : "scan_b_bad");
                                  lineColor = lv == 1 ? C_OK : lv == 2 ? C_WARN : lv == 3 ? C_BAD : C_MUTED;
                              } else if (st == DownloadManager.STATUS_FAILED) {
                                  line = S.t("dl_failed");
                                  lineColor = C_BAD;
                              } else if (st == DownloadManager.STATUS_PAUSED) {
                                  line = S.t("dl_paused");
                              } else if (st == DownloadManager.STATUS_PENDING) {
                                  line = S.t("dl_pending");
                              } else {
                                  running = true;
                                  pct = tot > 0 ? (int) (got * 100 / tot) : 0;
                                  line = S.t("dl_running").replace("{p}", String.valueOf(pct)) + " · " + fmtSize(got)
                                          + (tot > 0 ? " / " + fmtSize(tot) : "");
                                  lineColor = C_ACCENT;
                              }
                              LinearLayout row = new LinearLayout(MainActivity.this);
                              row.setOrientation(LinearLayout.VERTICAL);
                              row.setPadding(dp(16), dp(12), dp(16), dp(12));
                              row.setBackground(ripple());
                              TextView a1 = text(nm, 15, C_TEXT);
                              a1.setSingleLine(true);
                              a1.setEllipsize(android.text.TextUtils.TruncateAt.END);
                              TextView b1 = text(line, 12, lineColor);
                              b1.setPadding(0, dp(3), 0, 0);
                              row.addView(a1);
                              row.addView(b1);
                              if (st != -1 && st != DownloadManager.STATUS_SUCCESSFUL && st != DownloadManager.STATUS_FAILED) {
                                  ProgressBar pb = new ProgressBar(MainActivity.this, null, android.R.attr.progressBarStyleHorizontal);
                                  pb.setMax(100);
                                  pb.setProgress(pct);
                                  pb.setProgressTintList(ColorStateList.valueOf(C_ACCENT));
                                  row.addView(pb, new LinearLayout.LayoutParams(-1, dp(4)));
                              }
                              row.setOnClickListener(new View.OnClickListener() {
                                  @Override public void onClick(View v) { downloadActions(id, nm, url, st, fill[0]); }
                              });
                              list.addView(row, new LinearLayout.LayoutParams(-1, -2));
                          }
                          if (running) ui.postDelayed(fill[0], 1000);
                      }
                  };
                  fill[0].run();
                  sh[1].addView(actionText(S.t("dl_system"), new View.OnClickListener() {
                      @Override public void onClick(View v) {
                          try { startActivity(new Intent(DownloadManager.ACTION_VIEW_DOWNLOADS)); } catch (Exception e) { /* ignore */ }
                      }
                  }));
                  sh[1].addView(actionText(S.t("clear_all"), new View.OnClickListener() {
                      @Override public void onClick(View v) {
                          prefs.edit().putString("dl_list", "[]").apply();
                          fill[0].run();
                      }
                  }));
                  showFull(d);
              }

