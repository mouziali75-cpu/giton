                      }
                  });
                  fill.setColorFilter(C_MUTED);
                  row.addView(fill, new LinearLayout.LayoutParams(dp(44), dp(44)));
                  return row;
              }

              ArrayList<String> fetchSuggest(String q, String eng) {
                  ArrayList<String> out = new ArrayList<>();
                  try {
                      String e = Pages.enc(q), u;
                      if ("duckduckgo".equals(eng)) u = "https://duckduckgo.com/ac/?type=list&q=" + e;
                      else if ("bing".equals(eng)) u = "https://api.bing.com/osjson.aspx?query=" + e;
                      else if ("brave".equals(eng)) u = "https://search.brave.com/api/suggest?q=" + e;
                      else u = "https://suggestqueries.google.com/complete/search?client=firefox&q=" + e;
                      HttpURLConnection c = (HttpURLConnection) new URL(u).openConnection();
                      c.setConnectTimeout(3500);
                      c.setReadTimeout(3500);
                      c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/124.0 Mobile Safari/537.36");
                      if (c.getResponseCode() != 200) { c.disconnect(); return out; }
                      InputStream in = c.getInputStream();
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096];
                      int n;
                      while ((n = in.read(buf)) > 0 && bo.size() < 100000) bo.write(buf, 0, n);
                      in.close();
                      c.disconnect();
                      JSONArray a = new JSONArray(bo.toString("UTF-8"));
                      JSONArray l = a.optJSONArray(1);
                      if (l != null) {
                          for (int i = 0; i < l.length() && out.size() < 8; i++) {
                              String s = l.optString(i, "").trim();
                              if (!s.isEmpty()) out.add(s);
                          }
                      }
                  } catch (Exception ex) { /* no suggestions */ }
                  return out;
              }

