                  if (shown == 0) {
                      TextView e = text(S.t("net_empty"), 15, C_MUTED);
                      e.setGravity(Gravity.CENTER);
                      e.setPadding(dp(20), dp(60), dp(20), 0);
                      list.addView(e, new LinearLayout.LayoutParams(-1, -2));
                  }
                  showFull(d);
              }

