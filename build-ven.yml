              void toggleBookmark() {
                  String u = realUrl();
                  if (u == null) { toast(S.t("no_page")); return; }
                  JSONArray a = getArr("bm");
                  int found = -1;
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.optJSONObject(i);
                      if (o != null && u.equals(o.optString("u"))) found = i;
                  }
                  try {
                      if (found >= 0) {
                          a.remove(found);
                          prefs.edit().putString("bm", a.toString()).apply();
                          toast(S.t("bookmark_removed"));
                      } else {
                          JSONObject o = new JSONObject();
                          o.put("t", cur.title.isEmpty() ? pretty(u) : cur.title);
                          o.put("u", u);
                          prefs.edit().putString("bm", prepend(a, o, 500).toString()).apply();
                          toast(S.t("bookmark_added"));
                      }
                  } catch (Exception e) { /* ignore */ }
              }

