              static boolean isMediaUrl(String u) {
                  String l = u.toLowerCase(Locale.ROOT);
                  int q = l.indexOf('?');
                  if (q >= 0) l = l.substring(0, q);
                  String[] ex = {".mp4", ".m3u8", ".webm", ".mp3", ".m4a", ".mpd", ".ogg", ".flv", ".mkv", ".mov", ".aac", ".wav",
                          ".jpg", ".jpeg", ".png", ".gif", ".webp", ".svg", ".pdf", ".zip", ".apk"};
                  for (String x : ex) if (l.endsWith(x)) return true;
                  return false;
              }

