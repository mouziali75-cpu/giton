          cat > ic-android/app/src/main/java/com/autoclicker/imageclicker/Manager.kt <<'IC_EOF'
          package com.autoclicker.imageclicker

          import android.content.Context
          import android.graphics.Typeface
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import kotlin.math.roundToInt

          /** What the manager needs from the floating-bar service. */
          interface ManagerHost {
              fun close()
              fun changed()
              fun newTarget()
              fun retake(t: Target)
              fun pickRegion(t: Target)
          }

          /**
           * Everything you can change, shown on top of the game (no need to open the app):
           * Targets (picture, click spot, second spot, text condition, sensitivity, wait),
           * Words, Settings, Profiles.
           */
          class ManagerView(c: Context, startId: String?, private val host: ManagerHost) : FrameLayout(c) {

              private val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
              private val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT
              private var tab = 0
              private var openId: String? = startId
              private var targets: MutableList<Target> = Targets.list(c).toMutableList()
              private val tabBar = LinearLayout(c)
              private val body = FrameLayout(c)

              private fun dp(v: Int): Int = context.dp(v)

              init {
                  background = rounded(0xF2161036.toInt(), c.dpf(20f), Theme.ACCENT, c.dp(1))
                  isFocusableInTouchMode = true
                  setOnKeyListener { _, code, ev ->
                      if (code == KeyEvent.KEYCODE_BACK && ev.action == KeyEvent.ACTION_UP) { back(); true } else false
                  }
                  val col = LinearLayout(c).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                  }
                  val head = LinearLayout(c).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  head.addView(Ui.text(c, "Manage", 18f, Theme.TEXT, true), LinearLayout.LayoutParams(0, WRAP, 1f))
                  head.addView(Ui.iconBtn(c, Ic.CLOSE) { host.close() })
                  col.addView(head)
                  tabBar.orientation = LinearLayout.HORIZONTAL
                  col.addView(tabBar, LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(8); bottomMargin = dp(8) })
                  col.addView(body, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  addView(col, FrameLayout.LayoutParams(MATCH, MATCH))
                  render()
              }

              private fun persist() { Targets.saveAll(context, targets) }

              private fun back() {
                  if (tab == 0 && openId != null) { openId = null; render() } else host.close()
              }

              // ------------------------------------------------------------------ shell

              private fun renderTabs() {
                  tabBar.removeAllViews()
                  listOf("Targets", "Words", "Settings", "Profiles").forEachIndexed { i, name ->
                      val on = i == tab
                      tabBar.addView(
                          TextView(context).apply {
                              text = name
                              textSize = 12f
                              gravity = Gravity.CENTER
                              typeface = Typeface.DEFAULT_BOLD
                              setTextColor(if (on) Theme.BG else Theme.TEXT)
                              setPadding(0, dp(8), 0, dp(8))
                              background = rounded(if (on) Theme.GOLD else Theme.CARD2, context.dpf(12f))
                              isClickable = true
                              setOnClickListener { tab = i; openId = null; render() }
                          },
                          LinearLayout.LayoutParams(0, WRAP, 1f).apply { leftMargin = dp(3); rightMargin = dp(3) }
                      )
                  }
              }

              private fun render() {
                  renderTabs()
                  body.removeAllViews()
                  val cur = openId?.let { id -> targets.firstOrNull { it.id == id } }
                  val content = LinearLayout(context).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, dp(2), 0, dp(12))
                  }
                  when {
                      tab == 0 && cur != null -> detail(content, cur)
                      tab == 0 -> targetList(content)
                      tab == 1 -> wordsTab(content)
                      tab == 2 -> settingsTab(content)
                      else -> profilesTab(content)
                  }
                  body.addView(
                      ScrollView(context).apply {
                          isVerticalScrollBarEnabled = false
                          addView(content)
                      },
                      FrameLayout.LayoutParams(MATCH, MATCH)
                  )
              }

              // ------------------------------------------------------------------ small builders

              private fun section(p: LinearLayout, title: String) {
                  p.addView(Ui.text(context, title, 15f, Theme.GOLD, true).apply { setPadding(0, dp(14), 0, dp(2)) })
              }

              private fun toggleRow(parent: LinearLayout, title: String, sub: String, on: Boolean, onChange: (Boolean) -> Unit) {
                  val c = context
                  val r = LinearLayout(c).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(8), 0, dp(8))
                  }
                  val tx = LinearLayout(c).apply { orientation = LinearLayout.VERTICAL }
                  tx.addView(Ui.text(c, title, 14f))
                  if (sub.isNotEmpty()) tx.addView(Ui.text(c, sub, 11f, Theme.MUTED))
                  r.addView(tx, LinearLayout.LayoutParams(0, WRAP, 1f))
                  r.addView(ToggleView(c, on, onChange))
                  parent.addView(r)
              }

              private fun pctSlider(parent: LinearLayout, title: String, cur: Float, save: (Float) -> Unit) {
                  val v = ((cur * 100f) / 5f).roundToInt() * 5
                  Ui.slider(context, parent, title, -400, 500, 5, v.coerceIn(-400, 500), "%") { save(it / 100f) }
              }

              private fun choice(parent: LinearLayout, options: List<String>, sel: Int, onSel: (Int) -> Unit) {
                  val views = ArrayList<TextView>()
                  fun paint(s: Int) {
                      views.forEachIndexed { i, v -> v.background = rounded(if (i == s) Theme.ACCENT else Theme.CARD2, context.dpf(12f)) }
                  }
                  options.forEachIndexed { i, o ->
                      val v = TextView(context).apply {
                          text = o
                          textSize = 13f
                          setTextColor(Theme.TEXT)
                          setPadding(dp(12), dp(10), dp(12), dp(10))
                          isClickable = true
                          setOnClickListener { paint(i); onSel(i) }
                      }
                      views.add(v)
                      parent.addView(v, LinearLayout.LayoutParams(MATCH, WRAP).apply { bottomMargin = dp(6) })
                  }
                  paint(sel)
              }

              private fun edit(initial: String, hintText: String, onChange: (String) -> Unit): EditText =
                  EditText(context).apply {
                      setText(initial)
                      hint = hintText
                      setHintTextColor(Theme.MUTED)
                      setTextColor(Theme.TEXT)
                      textSize = 14f
                      setSingleLine()
                      background = rounded(Theme.CARD2, context.dpf(10f))
                      setPadding(dp(12), dp(10), dp(12), dp(10))
                      addTextChangedListener(object : TextWatcher {
                          override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, n: Int) {}
                          override fun onTextChanged(s: CharSequence?, a: Int, b: Int, n: Int) {}
                          override fun afterTextChanged(s: Editable?) { onChange(s?.toString() ?: "") }
                      })
                  }

              private fun toast(t: String) { Toast.makeText(context, t, Toast.LENGTH_SHORT).show() }

              // ------------------------------------------------------------------ targets

              private fun summary(t: Target): String {
                  val cond = when (t.condMode) {
                      1 -> " · 2nd spot on text"
                      2 -> " · only with text"
                      3 -> " · only without text"
                      else -> ""
                  }
                  return "click ${(t.fx * 100).toInt()}%, ${(t.fy * 100).toInt()}% · wait ${t.cooldownMs} ms$cond"
              }

              private fun targetList(p: LinearLayout) {
                  val c = context
                  p.addView(Ui.button(c, "Add picture target", true, Ic.ADD) { host.newTarget() })
                  p.addView(
                      Ui.text(
                          c,
                          "Tap a target to change its picture, click spot, second spot, text condition, sensitivity and wait time.",
                          12f, Theme.MUTED
                      ).apply { setPadding(0, 0, 0, dp(8)) }
                  )
                  if (targets.isEmpty()) p.addView(Ui.text(c, "No targets yet.", 14f, Theme.MUTED))
                  for (t in targets) {
                      val bmp = Targets.bitmap(c, t) ?: continue
                      val card = Ui.card(c)
                      card.isClickable = true
                      card.setOnClickListener { openId = t.id; render() }
                      val row = LinearLayout(c).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                      }
                      row.addView(
                          ThumbView(c, bmp, t.fx, t.fy, false).apply { background = rounded(Theme.CARD2, context.dpf(10f)) },
                          LinearLayout.LayoutParams(dp(88), dp(56))
                      )
                      val mid = LinearLayout(c).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(dp(10), 0, dp(6), 0)
                      }
                      mid.addView(Ui.text(c, t.name, 15f, Theme.TEXT, true))
                      mid.addView(Ui.text(c, summary(t), 11f, Theme.MUTED))
                      row.addView(mid, LinearLayout.LayoutParams(0, WRAP, 1f))
                      row.addView(ToggleView(c, t.enabled) { on -> t.enabled = on; persist(); host.changed() })
                      card.addView(row)
                      p.addView(card)
                  }
              }

              private fun regionText(t: Target): String =
                  if (t.regOn) "Area: ${(t.rl * 100).toInt()}%,${(t.rt * 100).toInt()}% to ${(t.rr * 100).toInt()}%,${(t.rb * 100).toInt()}% of the screen"
                  else "Area: whole screen"

              private fun detail(p: LinearLayout, t: Target) {
                  val c = context
                  val bmp = Targets.bitmap(c, t)

                  val top = LinearLayout(c).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  top.addView(Ui.chip(c, "< Back", false) { back() })
                  top.addView(
                      edit(t.name, "Name") { v -> if (v.isNotBlank()) { t.name = v; persist() } },
                      LinearLayout.LayoutParams(0, WRAP, 1f).apply { leftMargin = dp(8) }
                  )
                  p.addView(top)

                  val prev: ThumbView? = if (bmp != null) {
                      ThumbView(c, bmp, t.fx, t.fy, false, true).apply {
                          if (t.altOn) { ax = t.ax; ay = t.ay }
                          background = rounded(Theme.CARD2, c.dpf(12f))
                      }
                  } else null
                  if (prev != null) p.addView(prev, LinearLayout.LayoutParams(MATCH, dp(130)).apply { topMargin = dp(8); bottomMargin = dp(4) })
                  p.addView(Ui.text(c, "Gold = normal click spot.  Green = second spot (when turned on).", 11f, Theme.MUTED))

                  val acts = LinearLayout(c).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, dp(10), 0, dp(4))
                  }
                  acts.addView(Ui.chip(c, "Retake picture", false) { persist(); host.retake(t) })
                  var armed = false
                  val del = Ui.chip(c, "Delete", false) {}
                  del.setOnClickListener {
                      if (!armed) {
                          armed = true
                          del.text = "Tap again to delete"
                      } else {
                          Targets.delete(c, t)
                          targets.remove(t)
                          host.changed()
                          openId = null
                          render()
                      }
                  }
                  acts.addView(del, LinearLayout.LayoutParams(WRAP, WRAP).apply { leftMargin = dp(8) })
                  p.addView(acts)

                  toggleRow(p, "Enabled", "", t.enabled) { t.enabled = it; persist(); host.changed() }

                  section(p, "Where to click")
                  pctSlider(p, "Click X (0% = left edge, 100% = right edge)", t.fx) { t.fx = it; prev?.fx = it; prev?.invalidate(); persist() }
                  pctSlider(p, "Click Y (0% = top edge, 100% = bottom edge)", t.fy) { t.fy = it; prev?.fy = it; prev?.invalidate(); persist() }
                  p.addView(Ui.text(c, "Values below 0% or above 100% click outside the picture. You can also drag the gold dot with the pencil button on the floating bar.", 11f, Theme.MUTED))

                  section(p, "Second click spot")
                  val abox = LinearLayout(c).apply { orientation = LinearLayout.VERTICAL }
                  pctSlider(abox, "Second spot X", t.ax) { t.ax = it; if (t.altOn) prev?.ax = it; prev?.invalidate(); persist() }
                  pctSlider(abox, "Second spot Y", t.ay) { t.ay = it; if (t.altOn) prev?.ay = it; prev?.invalidate(); persist() }
                  abox.visibility = if (t.altOn) View.VISIBLE else View.GONE
                  toggleRow(p, "Use a second click spot", "Chosen by the text condition below", t.altOn) { on ->
                      t.altOn = on
                      if (on) { prev?.ax = t.ax; prev?.ay = t.ay } else { prev?.ax = Float.NaN; prev?.ay = Float.NaN }
                      prev?.invalidate()
                      abox.visibility = if (on) View.VISIBLE else View.GONE
                      persist()
                  }
                  p.addView(abox)

                  section(p, "Text condition")
                  val cbox = LinearLayout(c).apply { orientation = LinearLayout.VERTICAL }
                  cbox.addView(edit(t.condText, "Text to look for (separate several with commas)") { t.condText = it; persist() })
                  val regInfo = Ui.text(c, regionText(t), 12f, Theme.MUTED).apply { setPadding(0, dp(4), 0, dp(4)) }
                  toggleRow(cbox, "Only look inside an area", "Drag a box where the text appears", t.regOn) { on ->
                      t.regOn = on
                      persist()
                      regInfo.text = regionText(t)
                  }
                  cbox.addView(Ui.chip(c, "Set area on screen", true) { persist(); host.pickRegion(t) })
                  cbox.addView(regInfo)
                  cbox.visibility = if (t.condMode > 0) View.VISIBLE else View.GONE
                  choice(
                      p,
                      listOf(
                          "Off: always click",
                          "Use the second spot while the text is visible",
                          "Click only while the text is visible",
                          "Click only while the text is NOT visible"
                      ),
                      t.condMode
                  ) { i ->
                      t.condMode = i
                      cbox.visibility = if (i > 0) View.VISIBLE else View.GONE
                      persist()
                  }
                  p.addView(cbox)

                  section(p, "Matching")
                  val globalThr = Store.threshold(c)
                  var shown = (if (t.thr > 0) t.thr else globalThr).coerceIn(50, 95)
                  val sbox = LinearLayout(c).apply { orientation = LinearLayout.VERTICAL }
                  Ui.slider(c, sbox, "Sensitivity (lower = more tolerant)", 50, 95, 1, shown, "%") {
                      shown = it
                      if (t.thr > 0) { t.thr = it; persist() }
                  }
                  sbox.visibility = if (t.thr > 0) View.VISIBLE else View.GONE
                  toggleRow(p, "Own sensitivity", "Off = use the global value ($globalThr%)", t.thr > 0) { on ->
                      t.thr = if (on) shown else 0
                      sbox.visibility = if (on) View.VISIBLE else View.GONE
                      persist()
                  }
                  p.addView(sbox)
                  Ui.slider(c, p, "Wait after clicking it", 200, 10000, 100, (t.cooldownMs.coerceIn(200, 10000) / 100) * 100, " ms") {
                      t.cooldownMs = it
                      persist()
                  }
              }

              // ------------------------------------------------------------------ words

              private fun wordsTab(p: LinearLayout) {
                  val c = context
                  p.addView(Ui.text(c, "The app reads the screen text (offline, English) and clicks any matching word.", 12f, Theme.MUTED))
                  val add = LinearLayout(c).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(8), 0, dp(8))
                  }
                  val et = edit("", "New word, e.g. Claim") {}
                  add.addView(et, LinearLayout.LayoutParams(0, WRAP, 1f))
                  add.addView(
                      Ui.chip(c, "Add", true) {
                          val w = et.text.toString().trim()
