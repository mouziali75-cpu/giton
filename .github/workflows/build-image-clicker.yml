              // ------------------------------------------------------------------ settings

              private fun settingsTab(p: LinearLayout) {
                  val c = context
                  Ui.slider(c, p, "Taps per second", 5, 30, 1, Store.cps(c), "") { Store.setCps(c, it) }
                  Ui.slider(c, p, "Global match sensitivity (lower = more tolerant)", 60, 95, 1, Store.threshold(c), "%") { Store.setThreshold(c, it) }
                  Ui.slider(c, p, "Look for pictures every", 200, 2000, 100, Store.scanMs(c).toInt(), " ms") { Store.setScanMs(c, it) }
                  Ui.slider(c, p, "Read screen text every", 500, 5000, 100, Store.textMs(c).toInt().coerceIn(500, 5000), " ms") { Store.setTextMs(c, it) }
                  toggleRow(p, "Flexible matching", "Also match other sizes, colours and shapes", Store.flex(c)) { Store.setFlex(c, it); host.changed() }
                  toggleRow(p, "Show tap points", "Numbered rings where the farm taps land", Store.markers(c)) { Store.setMarkers(c, it); host.changed() }
              }

              // ------------------------------------------------------------------ profiles

              private fun profilesTab(p: LinearLayout) {
                  val c = context
                  val act = Profiles.active(c)
                  p.addView(Ui.text(c, "A profile stores your targets, tap points, words and settings.", 12f, Theme.MUTED))
                  val sv = LinearLayout(c).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(8), 0, dp(8))
                  }
                  val et = edit(act, "Profile name") {}
                  sv.addView(et, LinearLayout.LayoutParams(0, WRAP, 1f))
                  sv.addView(
                      Ui.chip(c, "Save", true) {
                          if (Profiles.save(c, et.text.toString())) { toast("Saved"); render() } else toast("Type a name first")
                      },
                      LinearLayout.LayoutParams(WRAP, WRAP).apply { leftMargin = dp(8) }
                  )
                  p.addView(sv)
                  for (n in Profiles.list(c)) {
                      val r = LinearLayout(c).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(0, dp(6), 0, dp(6))
                      }
                      r.addView(
                          Ui.text(c, n, 15f, if (n == act) Theme.GOLD else Theme.TEXT, n == act),
                          LinearLayout.LayoutParams(0, WRAP, 1f)
                      )
                      r.addView(Ui.chip(c, "Load", n != act) {
                          if (Profiles.load(c, n)) {
                              targets = Targets.list(c).toMutableList()
                              host.changed()
                              toast("Loaded $n")
                              render()
                          }
                      })
                      r.addView(Ui.iconBtn(c, Ic.TRASH, Theme.BAD) { Profiles.delete(c, n); render() })
                      p.addView(r)
                  }
                  if (Profiles.list(c).isEmpty()) p.addView(Ui.text(c, "No saved profiles yet.", 13f, Theme.MUTED))
              }
          }
