              // ------------------------------------------------------------------ guided setup

              private fun resumeFlow() {
                  val p = pending
                  if (p != null) {
                      pending = null
                      val ok = if (p == "acc") accOn() else ovlOn()
                      if (!ok) {
                          flow = false
                          toast("Still OFF. Press 'Set up & Start' again when ready.")
                          return
                      }
                  }
                  advance()
              }

              /** Opens the next missing permission, or starts screen capture when everything is ready. */
              private fun advance() {
                  when {
                      !accOn() -> {
                          pending = "acc"
                          toast("Turn ON 'Image Clicker', then press Back")
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                      !ovlOn() -> {
                          pending = "ovl"
                          toast("Allow 'Image Clicker', then press Back")
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      }
                      !notifOn() && !askedNotif -> {
                          askedNotif = true
                          requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), REQ_NOTIF)
                      }
                      else -> {
                          flow = false
                          val mpm = getSystemService(MediaProjectionManager::class.java)
                          @Suppress("DEPRECATION")
                          startActivityForResult(mpm.createScreenCaptureIntent(), REQ_CAPTURE)
                      }
                  }
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_CAPTURE && resultCode == RESULT_OK && data != null) {
                      val i = Intent(this, ClickerService::class.java)
                          .putExtra("code", resultCode)
                          .putExtra("data", data)
                      startForegroundService(i)
                      moveTaskToBack(true)
                  }
              }
          }
