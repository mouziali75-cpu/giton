          package com.autoclicker.imageclicker

          import android.content.Context
          import android.content.SharedPreferences

          object Store {
              fun prefs(c: Context): SharedPreferences = c.getSharedPreferences("cfg", Context.MODE_PRIVATE)

              fun cps(c: Context): Int = prefs(c).getInt("cps", 15)
              fun setCps(c: Context, v: Int) = prefs(c).edit().putInt("cps", v).apply()
              fun threshold(c: Context): Int = prefs(c).getInt("thr", 80)
              fun setThreshold(c: Context, v: Int) = prefs(c).edit().putInt("thr", v).apply()
              fun scanMs(c: Context): Long = prefs(c).getInt("scan", 500).toLong()
              fun setScanMs(c: Context, v: Int) = prefs(c).edit().putInt("scan", v).apply()
              fun markers(c: Context): Boolean = prefs(c).getBoolean("markers", false)
              fun setMarkers(c: Context, v: Boolean) = prefs(c).edit().putBoolean("markers", v).apply()

              /** Unlimited farm tap points, stored as "x,y;x,y;..." */
              fun points(c: Context): List<Pair<Float, Float>> {
                  val raw = prefs(c).getString("pts", "") ?: ""
                  return raw.split(";").mapNotNull {
                      val s = it.split(",")
                      val x = s.getOrNull(0)?.toFloatOrNull()
                      val y = s.getOrNull(1)?.toFloatOrNull()
                      if (x != null && y != null) Pair(x, y) else null
                  }
              }
              fun setPoints(c: Context, list: List<Pair<Float, Float>>) =
                  prefs(c).edit().putString("pts", list.joinToString(";") { "${it.first},${it.second}" }).apply()
              fun removePoint(c: Context, i: Int) {
                  val l = points(c).toMutableList()
                  if (i in l.indices) { l.removeAt(i); setPoints(c, l) }
              }

              fun flex(c: Context): Boolean = prefs(c).getBoolean("flex", true)
              fun setFlex(c: Context, v: Boolean) = prefs(c).edit().putBoolean("flex", v).apply()
              fun textMs(c: Context): Long = prefs(c).getInt("textms", 1500).toLong()
              fun setTextMs(c: Context, v: Int) = prefs(c).edit().putInt("textms", v).apply()

              private val DEFAULT_WORDS = listOf("Claim", "Collect", "Skip", "Skip Ad", "Close", "Continue")

              /** Words the app reads on screen (OCR) and clicks. Stored as "word|1;word|0" */
              fun words(c: Context): List<Pair<String, Boolean>> {
                  val raw = prefs(c).getString("words", null) ?: return DEFAULT_WORDS.map { Pair(it, true) }
                  return raw.split(";").filter { it.isNotBlank() }.map {
                      val i = it.lastIndexOf('|')
                      if (i < 0) Pair(it, true) else Pair(it.substring(0, i), it.substring(i + 1) == "1")
                  }
              }
              fun wordsRaw(c: Context): String = prefs(c).getString("words", "") ?: ""
              fun setWordsRaw(c: Context, raw: String) = prefs(c).edit().putString("words", raw).apply()
              fun setWords(c: Context, list: List<Pair<String, Boolean>>) =
                  setWordsRaw(c, list.joinToString(";") {
                      it.first.replace(";", " ").replace("|", " ").trim() + "|" + (if (it.second) "1" else "0")
                  })
              fun resetWords(c: Context) = prefs(c).edit().remove("words").apply()
          }
