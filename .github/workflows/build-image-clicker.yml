          package com.autoclicker.imageclicker

          import android.content.Context
          import android.content.res.ColorStateList
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.graphics.Bitmap
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import kotlin.math.min

          object Theme {
              val BG = 0xFF0F0A28.toInt()
              val CARD = 0xFF1C1445.toInt()
              val CARD2 = 0xFF2A1F63.toInt()
              val ACCENT = 0xFF7C5CFF.toInt()
              val GOLD = 0xFFFFC93C.toInt()
              val TEXT = 0xFFF3F0FF.toInt()
              val MUTED = 0xFFA79FD0.toInt()
              val ICON = 0xFFEDE9FE.toInt()
              val OK = 0xFF34D399.toInt()
              val BAD = 0xFFF87171.toInt()
          }

          fun Context.dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
          fun Context.dpf(v: Float): Float = v * resources.displayMetrics.density

          fun rounded(color: Int, radius: Float, stroke: Int = 0, strokeW: Int = 0): GradientDrawable =
              GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = radius
                  if (strokeW > 0) setStroke(strokeW, stroke)
              }

          object Ui {
              private const val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
              private const val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT

              fun text(c: Context, t: String, size: Float = 15f, color: Int = Theme.TEXT, bold: Boolean = false): TextView =
                  TextView(c).apply {
                      text = t
                      textSize = size
                      setTextColor(color)
                      if (bold) typeface = Typeface.DEFAULT_BOLD
                  }

              fun card(c: Context): LinearLayout = LinearLayout(c).apply {
                  orientation = LinearLayout.VERTICAL
                  background = rounded(Theme.CARD, c.dpf(18f))
                  setPadding(c.dp(16), c.dp(14), c.dp(16), c.dp(14))
                  layoutParams = LinearLayout.LayoutParams(MATCH, WRAP).apply { bottomMargin = c.dp(12) }
              }

              fun gap(c: Context, h: Int): View = View(c).apply { layoutParams = LinearLayout.LayoutParams(MATCH, c.dp(h)) }

              fun button(c: Context, label: String, primary: Boolean = true, icon: Int = -1, onClick: () -> Unit): View {
                  val row = LinearLayout(c).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      background = rounded(if (primary) Theme.ACCENT else Theme.CARD2, c.dpf(14f))
                      setPadding(c.dp(14), c.dp(12), c.dp(14), c.dp(12))
                      layoutParams = LinearLayout.LayoutParams(MATCH, WRAP).apply { bottomMargin = c.dp(8) }
                      isClickable = true
                      setOnClickListener { onClick() }
                  }
                  if (icon >= 0) {
                      row.addView(IconView(c, icon), LinearLayout.LayoutParams(c.dp(20), c.dp(20)).apply { rightMargin = c.dp(8) })
                  }
                  row.addView(text(c, label, 15f, Theme.TEXT, true))
                  return row
              }

              fun chip(c: Context, label: String, selected: Boolean = true, onClick: () -> Unit): TextView =
                  TextView(c).apply {
                      text = label
                      textSize = 13f
                      setTextColor(Theme.TEXT)
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(c.dp(14), c.dp(7), c.dp(14), c.dp(7))
                      background = rounded(if (selected) Theme.ACCENT else Theme.CARD2, c.dpf(14f))
                      isClickable = true
                      setOnClickListener { onClick() }
                  }

              fun iconBtn(c: Context, icon: Int, tint: Int = Theme.ICON, onClick: () -> Unit): View =
                  FrameLayout(c).apply {
                      background = rounded(Theme.CARD2, c.dpf(12f))
                      isClickable = true
                      setOnClickListener { onClick() }
                      addView(IconView(c, icon, tint), FrameLayout.LayoutParams(c.dp(20), c.dp(20), Gravity.CENTER))
                      layoutParams = LinearLayout.LayoutParams(c.dp(40), c.dp(40)).apply { leftMargin = c.dp(8) }
                  }

              fun slider(
                  c: Context, parent: LinearLayout, title: String,
                  lo: Int, hi: Int, step: Int, cur: Int, unit: String, save: (Int) -> Unit
              ) {
                  val label = text(c, "$title: $cur$unit", 14f, Theme.TEXT)
                  label.setPadding(0, c.dp(10), 0, 0)
                  parent.addView(label)
                  val bar = SeekBar(c)
                  bar.progressTintList = ColorStateList.valueOf(Theme.ACCENT)
                  bar.progressBackgroundTintList = ColorStateList.valueOf(Theme.CARD2)
                  bar.thumbTintList = ColorStateList.valueOf(Theme.GOLD)
                  bar.max = (hi - lo) / step
                  bar.progress = (cur - lo) / step
                  bar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) {
                          val v = lo + p * step
                          save(v)
                          label.text = "$title: $v$unit"
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })
                  parent.addView(bar)
              }
          }

          class ToggleView(c: Context, var on: Boolean, private val onChange: (Boolean) -> Unit) : View(c) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              init {
                  isClickable = true
                  setOnClickListener { on = !on; invalidate(); onChange(on) }
              }
              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension(context.dp(46), context.dp(26))
              }
              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  p.color = if (on) Theme.ACCENT else Theme.CARD2
                  cv.drawRoundRect(RectF(0f, 0f, w, h), h / 2, h / 2, p)
                  p.color = if (on) Theme.GOLD else Theme.MUTED
                  val r = h / 2 - context.dpf(3f)
                  cv.drawCircle(if (on) w - h / 2 else h / 2, h / 2, r, p)
              }
          }

          /** Shows a target picture with a gold cross where the click lands. Interactive = tap to move the cross.
           *  wide = draw the picture smaller so click spots outside the picture are visible too.
           *  ax/ay (when not NaN) = second click spot, drawn in green. */
          class ThumbView(
              c: Context,
              private val bmp: Bitmap,
              var fx: Float,
              var fy: Float,
              private val interactive: Boolean = false,
              private val wide: Boolean = false
          ) : View(c) {
              var ax = Float.NaN
              var ay = Float.NaN
              private val bp = Paint(Paint.FILTER_BITMAP_FLAG)
              private val cp = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  color = Theme.GOLD
                  strokeWidth = c.dpf(2f)
              }
              private val gp = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  color = Theme.OK
                  strokeWidth = c.dpf(2f)
              }
              private val wp = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  color = 0xFF000000.toInt()
                  strokeWidth = c.dpf(4f)
              }
              private val bd = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  color = Theme.MUTED
                  strokeWidth = c.dpf(1f)
              }

              private fun dst(): RectF {
                  var s = min(width.toFloat() / bmp.width, height.toFloat() / bmp.height)
                  if (wide) s *= 0.4f
                  val w = bmp.width * s
                  val h = bmp.height * s
                  val l = (width - w) / 2f
                  val t = (height - h) / 2f
                  return RectF(l, t, l + w, t + h)
              }

              private fun dot(cv: Canvas, x: Float, y: Float, color: Paint) {
                  val rad = context.dpf(8f)
                  val tick = context.dpf(6f)
                  for (pt in listOf(wp, color)) {
                      cv.drawCircle(x, y, rad, pt)
                      cv.drawLine(x - rad - tick, y, x - rad, y, pt); cv.drawLine(x + rad, y, x + rad + tick, y, pt)
                      cv.drawLine(x, y - rad - tick, x, y - rad, pt); cv.drawLine(x, y + rad, x, y + rad + tick, pt)
                  }
              }

              override fun onDraw(cv: Canvas) {
                  val r = dst()
                  cv.drawBitmap(bmp, null, r, bp)
                  if (wide) cv.drawRect(r, bd)
                  dot(cv, r.left + r.width() * fx, r.top + r.height() * fy, cp)
                  if (!ax.isNaN() && !ay.isNaN()) dot(cv, r.left + r.width() * ax, r.top + r.height() * ay, gp)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (!interactive) return false
                  val r = dst()
                  fx = ((e.x - r.left) / r.width()).coerceIn(0f, 1f)
                  fy = ((e.y - r.top) / r.height()).coerceIn(0f, 1f)
                  invalidate()
                  return true
              }
          }
