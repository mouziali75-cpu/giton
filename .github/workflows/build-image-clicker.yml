          package com.autoclicker.imageclicker

          import android.content.Context
          import org.json.JSONObject
          import java.io.File

          /** Named snapshots of: targets (+ click points), tap points, speed, sensitivity, scan interval. */
          object Profiles {
              private fun root(c: Context): File = File(c.filesDir, "profiles").apply { mkdirs() }

              fun safe(n: String): String = n.trim().replace(Regex("[^\\p{L}\\p{N} _-]"), "_").take(40)

              fun list(c: Context): List<String> =
                  root(c).listFiles { f -> f.isDirectory }?.map { it.name }?.sorted() ?: emptyList()

              fun active(c: Context): String = Store.prefs(c).getString("active", "") ?: ""

              fun save(c: Context, name: String): Boolean {
                  val n = safe(name)
                  if (n.isEmpty()) return false
                  val d = File(root(c), n)
                  d.deleteRecursively(); d.mkdirs()
                  Targets.dir(c).listFiles()?.forEach { it.copyTo(File(d, it.name), true) }
                  val cfg = JSONObject()
                      .put("cps", Store.cps(c)).put("thr", Store.threshold(c)).put("scan", Store.scanMs(c).toInt())
                      .put("pts", Store.prefs(c).getString("pts", "") ?: "")
                      .put("words", Store.wordsRaw(c)).put("hasWords", Store.prefs(c).contains("words"))
                      .put("flex", Store.flex(c)).put("textms", Store.textMs(c).toInt())
                  File(d, "config.json").writeText(cfg.toString())
                  Store.prefs(c).edit().putString("active", n).apply()
                  return true
              }

              fun load(c: Context, name: String): Boolean {
                  val d = File(root(c), name)
                  if (!d.isDirectory) return false
                  Targets.clear(c)
                  d.listFiles()?.forEach { if (it.name != "config.json") it.copyTo(File(Targets.dir(c), it.name), true) }
                  try {
                      val j = JSONObject(File(d, "config.json").readText())
                      Store.setCps(c, j.optInt("cps", 15))
                      Store.setThreshold(c, j.optInt("thr", 80))
                      Store.setScanMs(c, j.optInt("scan", 500))
                      Store.prefs(c).edit().putString("pts", j.optString("pts", "")).apply()
                      if (j.optBoolean("hasWords", false)) Store.setWordsRaw(c, j.optString("words", "")) else Store.resetWords(c)
                      Store.setFlex(c, j.optBoolean("flex", true))
                      Store.setTextMs(c, j.optInt("textms", 1500))
                  } catch (e: Exception) { }
                  Store.prefs(c).edit().putString("active", name).apply()
                  return true
              }

              fun delete(c: Context, name: String) {
                  File(root(c), name).deleteRecursively()
                  if (active(c) == name) Store.prefs(c).edit().remove("active").apply()
              }
          }
