              // ------------------------------------------------------------------ Profiles

              private fun profilesView(): View = page {
                  val ctx = this@MainActivity
                  addView(Ui.text(ctx, "Profiles", 22f, Theme.TEXT, true))

                  val info = Ui.card(ctx)
                  info.addView(
                      Ui.text(
                          ctx,
                          "Your setup (targets, click points, tap points, speed, sensitivity) is saved automatically. " +
                              "Save it as a named profile to keep one setup per game and switch in one tap.",
                          13f, Theme.MUTED
                      )
                  )
                  info.layoutParams = (info.layoutParams as LinearLayout.LayoutParams).apply { topMargin = dp(8) }
                  addView(info)

                  addView(Ui.button(ctx, "Save current setup as profile", true, Ic.SAVE) {
                      askText("Profile name", "") { n ->
                          if (Profiles.save(ctx, n)) toast("Saved") else toast("Type a name first")
                          show(2)
                      }
                  })
                  val active = Profiles.active(ctx)
                  if (active.isNotEmpty()) {
                      addView(Ui.button(ctx, "Update \"$active\" with current setup", false, Ic.SAVE) {
                          Profiles.save(ctx, active)
                          toast("Updated")
                          show(2)
                      })
                  }

                  val names = Profiles.list(ctx)
                  if (names.isEmpty()) addView(Ui.text(ctx, "No saved profiles yet.", 14f, Theme.MUTED))
                  for (n in names) {
                      val card = Ui.card(ctx)
                      val r = LinearLayout(ctx).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                      }
                      r.addView(
