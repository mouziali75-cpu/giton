name: Build Image Clicker APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        run: |
          set -e
          mkdir -p ic-android/app/src/main/java/com/autoclicker/imageclicker ic-android/app/src/main/res/xml ic-android/app/src/main/res/values ic-android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p $(dirname ic-android/settings.gradle.kts)
          cat > ic-android/settings.gradle.kts <<'IC_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ImageClicker"
          include(":app")
          IC_EOF
          mkdir -p $(dirname ic-android/build.gradle.kts)
          cat > ic-android/build.gradle.kts <<'IC_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          IC_EOF
          mkdir -p $(dirname ic-android/gradle.properties)
          cat > ic-android/gradle.properties <<'IC_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          IC_EOF
          mkdir -p $(dirname ic-android/app/build.gradle.kts)
          cat > ic-android/app/build.gradle.kts <<'IC_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.autoclicker.imageclicker"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.autoclicker.imageclicker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("org.opencv:opencv:4.9.0")
          }
          IC_EOF
          mkdir -p $(dirname ic-android/app/src/main/AndroidManifest.xml)
          cat > ic-android/app/src/main/AndroidManifest.xml <<'IC_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:icon="@mipmap/ic_launcher"
                  android:label="Image Clicker"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ClickerService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".ClickerAccessibility"
                      android:exported="false"
                      android:label="Image Clicker"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          IC_EOF
          mkdir -p $(dirname ic-android/app/src/main/res/xml/accessibility_config.xml)
          cat > ic-android/app/src/main/res/xml/accessibility_config.xml <<'IC_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          IC_EOF
          mkdir -p $(dirname ic-android/app/src/main/res/values/strings.xml)
          cat > ic-android/app/src/main/res/values/strings.xml <<'IC_EOF'
          <resources>
              <string name="accessibility_desc">Used only to perform taps on the screen for the auto clicker.</string>
          </resources>
          IC_EOF
          mkdir -p $(dirname ic-android/app/src/main/java/com/autoclicker/imageclicker/Store.kt)
          cat > ic-android/app/src/main/java/com/autoclicker/imageclicker/Store.kt <<'IC_EOF'
          package com.autoclicker.imageclicker

          import android.content.Context
          import android.content.SharedPreferences

          object Store {
              fun prefs(c: Context): SharedPreferences = c.getSharedPreferences("cfg", Context.MODE_PRIVATE)
              fun cps(c: Context): Int = prefs(c).getInt("cps", 15)
              fun setCps(c: Context, v: Int) = prefs(c).edit().putInt("cps", v).apply()

              /** Unlimited farm tap points, stored as "x,y;x,y;..." */
              fun points(c: Context): List<Pair<Float, Float>> {
                  val raw = prefs(c).getString("pts", "") ?: ""
                  return raw.split(";").mapNotNull {
                      val s = it.split(",")
                      val x = s.getOrNull(0)?.toFloatOrNull()
                      val y = s.getOrNull(1)?.toFloatOrNull()
                      if (x != null && y != null) Pair(x, y) else null
                  }
              }
              fun addPoint(c: Context, x: Float, y: Float) {
                  val raw = prefs(c).getString("pts", "") ?: ""
                  prefs(c).edit().putString("pts", if (raw.isEmpty()) "$x,$y" else "$raw;$x,$y").apply()
              }
              fun clearPoints(c: Context) = prefs(c).edit().remove("pts").apply()
          }
          IC_EOF
          mkdir -p $(dirname ic-android/app/src/main/java/com/autoclicker/imageclicker/ClickerAccessibility.kt)
          cat > ic-android/app/src/main/java/com/autoclicker/imageclicker/ClickerAccessibility.kt <<'IC_EOF'
          package com.autoclicker.imageclicker

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          /** Only job: perform a tap at (x, y). */
          class ClickerAccessibility : AccessibilityService() {

              companion object {
                  @Volatile var instance: ClickerAccessibility? = null
              }

              override fun onServiceConnected() { instance = this }
              override fun onUnbind(intent: android.content.Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              /** Blocking tap (call from a background thread). */
              fun tap(x: Float, y: Float) {
                  val path = Path().apply { moveTo(x, y) }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 10))
                      .build()
                  val latch = CountDownLatch(1)
                  val ok = dispatchGesture(gesture, object : GestureResultCallback() {
                      override fun onCompleted(g: GestureDescription?) { latch.countDown() }
                      override fun onCancelled(g: GestureDescription?) { latch.countDown() }
                  }, null)
                  if (ok) latch.await(300, TimeUnit.MILLISECONDS)
              }
          }
          IC_EOF
          mkdir -p $(dirname ic-android/app/src/main/java/com/autoclicker/imageclicker/MainActivity.kt)
          cat > ic-android/app/src/main/java/com/autoclicker/imageclicker/MainActivity.kt <<'IC_EOF'
          package com.autoclicker.imageclicker

          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private val REQ_CAPTURE = 1

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 0)
                  }

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                  }
                  fun text(t: String, size: Float = 16f) = TextView(this).apply {
                      text = t; textSize = size; setPadding(0, dp(6), 0, dp(6))
                  }.also { root.addView(it) }
                  fun button(t: String, a: () -> Unit) = Button(this).apply {
                      text = t; setOnClickListener { a() }
                  }.also { root.addView(it) }

                  text("Image Clicker", 28f)
                  text("Auto-farm taps + auto-click on pictures (Claim, ❌, Skip, Close).")
                  status = text("")

                  button("1. Enable Accessibility service") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      Toast.makeText(this, "Open 'Image Clicker' and turn it ON", Toast.LENGTH_LONG).show()
                  }
                  button("2. Allow display over other apps") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }

                  val cpsLabel = text("Taps per second: ${Store.cps(this)}")
                  root.addView(SeekBar(this).apply {
                      max = 25
                      progress = Store.cps(this@MainActivity) - 5
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) {
                              Store.setCps(this@MainActivity, p + 5)
                              cpsLabel.text = "Taps per second: ${p + 5}"
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  })

                  button("3. Start") { start() }
                  button("Stop") { stopService(Intent(this, ClickerService::class.java)) }

                  text(
                      "\nHOW TO USE\n" +
                      "• Press Start, then choose 'Entire screen' and allow.\n" +
                      "• Open your game. A small floating bar appears.\n" +
                      "• ➕  Add target (unlimited): drag a box around a button (Claim, ❌, Skip, Close). Repeat for each one.\n" +
                      "• 🎯  Add tap point (unlimited): touch a spot to farm. Several points are tapped in turn.\n" +
                      "• ▶  Start / ⏸ pause.   ✥ Move bar.   ✕ Exit.\n" +
                      "• Tap 🗑 = delete last target, hold 🗑 = delete all.  Hold 🎯 = clear tap points.\n\n" +
                      "Whenever a saved target is seen on screen, it is clicked first. Otherwise the app keeps tapping the tap point."
                  )

                  setContentView(ScrollView(this).apply { addView(root) })
              }

              override fun onResume() {
                  super.onResume()
                  val acc = if (ClickerAccessibility.instance != null) "✅" else "❌"
                  val ovl = if (Settings.canDrawOverlays(this)) "✅" else "❌"
                  status.text = "Accessibility: $acc     Overlay permission: $ovl"
              }

              private fun start() {
                  if (ClickerAccessibility.instance == null) {
                      Toast.makeText(this, "Enable the Accessibility service first (step 1)", Toast.LENGTH_LONG).show(); return
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Allow overlay first (step 2)", Toast.LENGTH_LONG).show(); return
                  }
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  @Suppress("DEPRECATION")
                  startActivityForResult(mpm.createScreenCaptureIntent(), REQ_CAPTURE)
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_CAPTURE && resultCode == RESULT_OK && data != null) {
                      val i = Intent(this, ClickerService::class.java)
                          .putExtra("code", resultCode)
                          .putExtra("data", data)
                      startForegroundService(i)
                      moveTaskToBack(true)
                  }
              }
          }
          IC_EOF
          mkdir -p $(dirname ic-android/app/src/main/java/com/autoclicker/imageclicker/ClickerService.kt)
          cat > ic-android/app/src/main/java/com/autoclicker/imageclicker/ClickerService.kt <<'IC_EOF'
          package com.autoclicker.imageclicker

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.PixelFormat
          import android.graphics.RectF
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import android.util.DisplayMetrics
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import org.opencv.android.OpenCVLoader
          import org.opencv.android.Utils
          import org.opencv.core.Core
          import org.opencv.core.Mat
          import org.opencv.core.Size
          import org.opencv.imgproc.Imgproc
          import java.io.File
          import java.io.FileOutputStream
          import kotlin.math.max
          import kotlin.math.min

          class ClickerService : Service() {

              companion object {
                  const val ACTION_STOP = "com.autoclicker.imageclicker.STOP"
                  private const val CHANNEL = "clicker"
                  private const val SCALE = 0.5      // match on half-size images (faster)
                  private const val THRESHOLD = 0.80 // 0..1, lower = more tolerant
                  private const val SCAN_EVERY_MS = 500L
              }

              private lateinit var wm: WindowManager
              private val ui = Handler(Looper.getMainLooper())

              private var projection: MediaProjection? = null
              private var reader: ImageReader? = null
              private var display: VirtualDisplay? = null
              private var sw = 0
              private var sh = 0
              private var lastFrame: Bitmap? = null

              private var panel: View? = null
              private var picker: View? = null
              private var playBtn: TextView? = null

              @Volatile private var running = false
              private var worker: Thread? = null
              @Volatile private var templates: List<Mat> = emptyList()

              override fun onBind(intent: Intent?): IBinder? = null

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun toast(t: String) = ui.post { Toast.makeText(this, t, Toast.LENGTH_SHORT).show() }

              @Suppress("DEPRECATION")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent == null || intent.action == ACTION_STOP) { stopSelf(); return START_NOT_STICKY }
                  if (projection != null) return START_NOT_STICKY

                  startForegroundCompat()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager

                  if (!OpenCVLoader.initLocal()) { toast("OpenCV failed to load"); stopSelf(); return START_NOT_STICKY }

                  val code = intent.getIntExtra("code", 0)
                  val data = intent.getParcelableExtra<Intent>("data")
                  if (data == null) { stopSelf(); return START_NOT_STICKY }

                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projection = mpm.getMediaProjection(code, data)
                  projection!!.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { ui.post { stopSelf() } }
                  }, ui)

                  val dm = DisplayMetrics()
                  wm.defaultDisplay.getRealMetrics(dm)
                  sw = dm.widthPixels; sh = dm.heightPixels
                  reader = ImageReader.newInstance(sw, sh, PixelFormat.RGBA_8888, 2)
                  display = projection!!.createVirtualDisplay(
                      "clicker", sw, sh, dm.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader!!.surface, null, null
                  )

                  loadTemplates()
                  showPanel()
                  toast("Ready. Add targets with ➕ then press ▶")
                  return START_NOT_STICKY
              }

              private fun startForegroundCompat() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(CHANNEL, "Image Clicker", NotificationManager.IMPORTANCE_LOW))
                  val stop = PendingIntent.getService(
                      this, 0, Intent(this, ClickerService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  val n = Notification.Builder(this, CHANNEL)
                      .setContentTitle("Image Clicker is running")
                      .setContentText("Tap to stop")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentIntent(stop)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else startForeground(1, n)
              }

              // ---------------------------------------------------------------- screen capture

              @Synchronized
              private fun grab(): Bitmap? {
                  val img = reader?.acquireLatestImage()
                  if (img != null) {
                      try {
                          val p = img.planes[0]
                          val rowPad = p.rowStride - p.pixelStride * img.width
                          val full = Bitmap.createBitmap(img.width + rowPad / p.pixelStride, img.height, Bitmap.Config.ARGB_8888)
                          full.copyPixelsFromBuffer(p.buffer)
                          lastFrame = Bitmap.createBitmap(full, 0, 0, img.width, img.height)
                      } finally { img.close() }
                  }
                  return lastFrame
              }

              // ---------------------------------------------------------------- targets

              private fun targetsDir() = File(filesDir, "targets").apply { mkdirs() }

              private fun toGray(b: Bitmap): Mat {
                  val m = Mat()
                  Utils.bitmapToMat(b, m)
                  Imgproc.cvtColor(m, m, Imgproc.COLOR_RGBA2GRAY)
                  Imgproc.resize(m, m, Size(), SCALE, SCALE, Imgproc.INTER_AREA)
                  return m
              }

              private fun loadTemplates() {
                  val old = templates
                  val files = targetsDir().listFiles { f -> f.extension == "png" }?.sortedBy { it.name } ?: emptyList()
                  templates = files.mapNotNull { f -> BitmapFactory.decodeFile(f.path)?.let { toGray(it) } }
                  old.forEach { it.release() }
              }

              /** Returns screen coordinates of the first target found, or null. */
              private fun scan(): Pair<Float, Float>? {
                  val tpls = templates
                  if (tpls.isEmpty()) return null
                  val frame = grab() ?: return null
                  val m = toGray(frame)
                  try {
                      for (t in tpls) {
                          if (t.cols() > m.cols() || t.rows() > m.rows()) continue
                          val r = Mat()
                          Imgproc.matchTemplate(m, t, r, Imgproc.TM_CCOEFF_NORMED)
                          val mm = Core.minMaxLoc(r)
                          r.release()
                          if (mm.maxVal >= THRESHOLD) {
                              val x = ((mm.maxLoc.x + t.cols() / 2.0) / SCALE).toFloat()
                              val y = ((mm.maxLoc.y + t.rows() / 2.0) / SCALE).toFloat()
                              return Pair(x, y)
                          }
                      }
                  } finally { m.release() }
                  return null
              }

              // ---------------------------------------------------------------- main loop

              private fun setRunning(on: Boolean) {
                  if (on == running) return
                  if (on) {
                      if (ClickerAccessibility.instance == null) { toast("Accessibility service is OFF"); return }
                      running = true
                      worker = Thread { loop() }.also { it.start() }
                  } else {
                      running = false
                  }
                  playBtn?.text = if (running) "⏸" else "▶"
              }

              private fun loop() {
                  var lastScan = 0L
                  var idx = 0
                  while (running) {
                      val acc = ClickerAccessibility.instance
                      if (acc == null) { SystemClock.sleep(500); continue }
                      val now = SystemClock.uptimeMillis()
                      if (now - lastScan >= SCAN_EVERY_MS) {
                          lastScan = now
                          val hit = try { scan() } catch (e: Exception) { null }
                          if (hit != null) {
                              acc.tap(hit.first, hit.second)
                              SystemClock.sleep(800)
                              continue
                          }
                      }
                      val pts = Store.points(this)
                      val pt = if (pts.isEmpty()) Pair(sw / 2f, sh / 2f) else pts[idx++ % pts.size]
                      acc.tap(pt.first, pt.second)
                      SystemClock.sleep((1000L / Store.cps(this)).coerceAtLeast(1L))
                  }
              }

              // ---------------------------------------------------------------- floating bar

              private fun overlayType() = WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY

              private fun showPanel() {
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      overlayType(), WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START; x = 0; y = dp(200) }

                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xCC1B1340.toInt())
                  }
                  fun btn(t: String, onLong: (() -> Unit)? = null, onClick: () -> Unit) = TextView(this).apply {
                      text = t; textSize = 22f; gravity = Gravity.CENTER
                      setTextColor(Color.WHITE); setPadding(dp(10), dp(8), dp(10), dp(8))
                      setOnClickListener { onClick() }
                      if (onLong != null) setOnLongClickListener { onLong(); true }
                  }.also { col.addView(it) }

                  // drag handle
                  val handle = btn("✥") { }
                  var dx = 0f; var dy = 0f; var sx = 0; var sy = 0
                  handle.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { dx = e.rawX; dy = e.rawY; sx = lp.x; sy = lp.y }
                          MotionEvent.ACTION_MOVE -> {
                              lp.x = sx + (e.rawX - dx).toInt(); lp.y = sy + (e.rawY - dy).toInt()
                              wm.updateViewLayout(col, lp)
                          }
                      }
                      true
                  }
                  playBtn = btn("▶") { setRunning(!running) }
                  btn("🎯", { Store.clearPoints(this); toast("All tap points cleared") }) { openPicker(true) }
                  btn("➕") { openPicker(false) }
                  btn("🗑", {
                      targetsDir().listFiles()?.forEach { it.delete() }
                      loadTemplates(); toast("All targets deleted")
                  }) {
                      targetsDir().listFiles()?.sortedBy { it.name }?.lastOrNull()?.delete()
                      loadTemplates(); toast("Last target deleted (${templates.size} left)")
                  }
                  btn("✕") { stopSelf() }

                  wm.addView(col, lp)
                  panel = col
              }

              // ---------------------------------------------------------------- picker (freeze screen, choose area/point)

              private class SelView(
                  c: Context,
                  private val onDone: (RectF, Int, Int) -> Unit
              ) : View(c) {
                  private val paint = Paint().apply { color = 0xFF00E5FF.toInt(); style = Paint.Style.STROKE; strokeWidth = 6f }
                  private var x0 = 0f; private var y0 = 0f; private var x1 = 0f; private var y1 = 0f
                  private var drawing = false

                  override fun onTouchEvent(e: MotionEvent): Boolean {
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { x0 = e.x; y0 = e.y; x1 = x0; y1 = y0; drawing = true }
                          MotionEvent.ACTION_MOVE -> { x1 = e.x; y1 = e.y }
                          MotionEvent.ACTION_UP -> {
                              x1 = e.x; y1 = e.y; drawing = false
                              onDone(RectF(min(x0, x1), min(y0, y1), max(x0, x1), max(y0, y1)), width, height)
                          }
                      }
                      invalidate()
                      return true
                  }

                  override fun onDraw(canvas: Canvas) {
                      if (drawing) canvas.drawRect(x0, y0, x1, y1, paint)
                  }
              }

              private fun closePicker() {
                  picker?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  picker = null
                  panel?.visibility = View.VISIBLE
              }

              private fun openPicker(pointMode: Boolean) {
                  if (picker != null) return
                  setRunning(false)
                  SystemClock.sleep(150)
                  val frame = grab()
                  if (frame == null) { toast("No screen image yet, try again"); return }

                  val root = FrameLayout(this)
                  root.addView(ImageView(this).apply {
                      setImageBitmap(frame); scaleType = ImageView.ScaleType.FIT_XY
                  }, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)

                  root.addView(SelView(this) { rect, vw, vh ->
                      val fx = frame.width.toFloat() / vw
                      val fy = frame.height.toFloat() / vh
                      if (pointMode) {
                          Store.addPoint(this, rect.centerX() * fx, rect.centerY() * fy)
                          toast("Tap point added (${Store.points(this).size} total)")
                          closePicker()
                      } else {
                          val l = (rect.left * fx).toInt().coerceIn(0, frame.width - 1)
                          val t = (rect.top * fy).toInt().coerceIn(0, frame.height - 1)
                          val r = (rect.right * fx).toInt().coerceIn(l + 1, frame.width)
                          val b = (rect.bottom * fy).toInt().coerceIn(t + 1, frame.height)
                          if (r - l < 16 || b - t < 16) {
                              toast("Box too small, try again")
                          } else {
                              val crop = Bitmap.createBitmap(frame, l, t, r - l, b - t)
                              FileOutputStream(File(targetsDir(), "t_${System.currentTimeMillis()}.png")).use {
                                  crop.compress(Bitmap.CompressFormat.PNG, 100, it)
                              }
                              loadTemplates()
                              toast("Target saved (${templates.size} total)")
                              closePicker()
                          }
                      }
                  }, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)

                  root.addView(TextView(this).apply {
                      text = if (pointMode) "Touch a spot to add a farm tap point"
                             else "Drag a box tightly around the button"
                      setTextColor(Color.WHITE); setBackgroundColor(0xAA000000.toInt())
                      textSize = 16f; setPadding(dp(12), dp(8), dp(12), dp(8))
                  }, FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                      Gravity.TOP or Gravity.CENTER_HORIZONTAL).apply { topMargin = dp(40) })

                  root.addView(Button(this).apply {
                      text = "Cancel"; setOnClickListener { closePicker() }
                  }, FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                      Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL).apply { bottomMargin = dp(60) })

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  panel?.visibility = View.GONE
                  wm.addView(root, lp)
                  picker = root
              }

              // ---------------------------------------------------------------- cleanup

              override fun onDestroy() {
                  running = false
                  picker?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  panel?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  display?.release()
                  reader?.close()
                  projection?.stop()
                  templates.forEach { it.release() }
                  super.onDestroy()
              }
          }
