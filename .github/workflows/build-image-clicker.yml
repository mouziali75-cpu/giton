          cat > ic-android/app/src/main/java/com/autoclicker/imageclicker/Icons.kt <<'IC_EOF'
          package com.autoclicker.imageclicker

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.view.View

          /** Hand-drawn line icons, one colour, drawn on a 24x24 grid. */
          object Ic {
              const val PLAY = 0
              const val PAUSE = 1
              const val ADD = 2
              const val TARGET = 3
              const val PENCIL = 4
              const val EYE = 5
              const val SLIDERS = 6
              const val TRASH = 7
              const val GRIP = 8
              const val CLOSE = 9
              const val SAVE = 10
              const val HOME = 11
              const val LIST = 12
              const val INFO = 13
              const val CHECK = 14
              const val WARN = 15

              fun draw(cv: Canvas, kind: Int, p: Paint, color: Int, left: Float, top: Float, size: Float) {
                  cv.save()
                  cv.translate(left, top)
                  val u = size / 24f
                  cv.scale(u, u)
                  p.color = color
                  p.strokeWidth = 2f
                  p.strokeCap = Paint.Cap.ROUND
                  p.strokeJoin = Paint.Join.ROUND
                  val line = Paint.Style.STROKE
                  val solid = Paint.Style.FILL
                  when (kind) {
                      PLAY -> {
                          p.style = Paint.Style.FILL_AND_STROKE
                          val a = Path()
                          a.moveTo(7f, 5f); a.lineTo(19f, 12f); a.lineTo(7f, 19f); a.close()
                          cv.drawPath(a, p)
                      }
                      PAUSE -> {
                          p.style = Paint.Style.FILL_AND_STROKE
                          cv.drawRoundRect(RectF(6.5f, 5.5f, 9.5f, 18.5f), 1f, 1f, p)
                          cv.drawRoundRect(RectF(14.5f, 5.5f, 17.5f, 18.5f), 1f, 1f, p)
                      }
                      ADD -> {
                          p.style = line
                          cv.drawLine(12f, 5f, 12f, 19f, p); cv.drawLine(5f, 12f, 19f, 12f, p)
                      }
                      TARGET -> {
                          p.style = line
                          cv.drawCircle(12f, 12f, 6.5f, p)
                          cv.drawLine(12f, 2.5f, 12f, 6f, p); cv.drawLine(12f, 18f, 12f, 21.5f, p)
                          cv.drawLine(2.5f, 12f, 6f, 12f, p); cv.drawLine(18f, 12f, 21.5f, 12f, p)
                          p.style = solid
                          cv.drawCircle(12f, 12f, 1.7f, p)
                      }
                      PENCIL -> {
                          p.style = line
                          val a = Path()
                          a.moveTo(4f, 20f); a.lineTo(5.2f, 15.2f); a.lineTo(15.5f, 4.9f)
                          a.lineTo(19.1f, 8.5f); a.lineTo(8.8f, 18.8f); a.close()
                          cv.drawPath(a, p)
                          cv.drawLine(13.5f, 6.9f, 17.1f, 10.5f, p)
                      }
                      EYE -> {
                          p.style = line
                          cv.drawOval(RectF(2f, 6.5f, 22f, 17.5f), p)
                          cv.drawCircle(12f, 12f, 3f, p)
                      }
                      SLIDERS -> {
                          p.style = line
                          cv.drawLine(4f, 6f, 20f, 6f, p); cv.drawLine(4f, 12f, 20f, 12f, p); cv.drawLine(4f, 18f, 20f, 18f, p)
                          p.style = solid
                          cv.drawCircle(9f, 6f, 2.6f, p); cv.drawCircle(15f, 12f, 2.6f, p); cv.drawCircle(8f, 18f, 2.6f, p)
                      }
                      TRASH -> {
                          p.style = line
                          cv.drawLine(4f, 7f, 20f, 7f, p)
                          val a = Path()
                          a.moveTo(9f, 7f); a.lineTo(9f, 4f); a.lineTo(15f, 4f); a.lineTo(15f, 7f)
                          cv.drawPath(a, p)
                          val b = Path()
                          b.moveTo(6f, 7f); b.lineTo(7f, 20f); b.lineTo(17f, 20f); b.lineTo(18f, 7f)
                          cv.drawPath(b, p)
                          cv.drawLine(10f, 11f, 10f, 16f, p); cv.drawLine(14f, 11f, 14f, 16f, p)
                      }
                      GRIP -> {
                          p.style = solid
                          for (y in listOf(6f, 12f, 18f)) { cv.drawCircle(9f, y, 1.7f, p); cv.drawCircle(15f, y, 1.7f, p) }
                      }
                      CLOSE -> {
                          p.style = line
                          cv.drawLine(6f, 6f, 18f, 18f, p); cv.drawLine(18f, 6f, 6f, 18f, p)
                      }
                      SAVE -> {
                          p.style = line
                          cv.drawRoundRect(RectF(4f, 4f, 20f, 20f), 2.5f, 2.5f, p)
                          cv.drawRect(RectF(8f, 4f, 16f, 9f), p)
                          cv.drawRect(RectF(8f, 14f, 16f, 20f), p)
                      }
                      HOME -> {
                          p.style = line
                          val a = Path()
                          a.moveTo(3f, 11f); a.lineTo(12f, 3.5f); a.lineTo(21f, 11f)
                          cv.drawPath(a, p)
                          val b = Path()
                          b.moveTo(5.5f, 9.5f); b.lineTo(5.5f, 20f); b.lineTo(18.5f, 20f); b.lineTo(18.5f, 9.5f)
                          cv.drawPath(b, p)
                          val d = Path()
                          d.moveTo(10f, 20f); d.lineTo(10f, 14.5f); d.lineTo(14f, 14.5f); d.lineTo(14f, 20f)
                          cv.drawPath(d, p)
                      }
                      LIST -> {
                          p.style = line
                          cv.drawLine(9f, 6f, 20f, 6f, p); cv.drawLine(9f, 12f, 20f, 12f, p); cv.drawLine(9f, 18f, 20f, 18f, p)
                          p.style = solid
                          cv.drawCircle(4.5f, 6f, 1.5f, p); cv.drawCircle(4.5f, 12f, 1.5f, p); cv.drawCircle(4.5f, 18f, 1.5f, p)
                      }
                      INFO -> {
                          p.style = line
                          cv.drawCircle(12f, 12f, 9f, p)
                          cv.drawLine(12f, 11f, 12f, 17f, p)
                          p.style = solid
                          cv.drawCircle(12f, 7.6f, 1.2f, p)
                      }
                      CHECK -> {
                          p.style = line
                          val a = Path()
                          a.moveTo(5f, 12.5f); a.lineTo(10f, 17.5f); a.lineTo(19f, 7f)
                          cv.drawPath(a, p)
                      }
                      WARN -> {
                          p.style = line
                          val a = Path()
                          a.moveTo(12f, 3.5f); a.lineTo(21.5f, 20f); a.lineTo(2.5f, 20f); a.close()
                          cv.drawPath(a, p)
                          cv.drawLine(12f, 9.5f, 12f, 14f, p)
                          p.style = solid
                          cv.drawCircle(12f, 17f, 1.1f, p)
                      }
                  }
                  cv.restore()
              }
          }

          class IconView(c: Context, var kind: Int, var color: Int = Theme.ICON) : View(c) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              override fun onDraw(cv: Canvas) {
                  val s = minOf(width, height).toFloat()
                  Ic.draw(cv, kind, p, color, (width - s) / 2f, (height - s) / 2f, s)
              }
          }
          IC_EOF
          mkdir -p ic-android/app/src/main/java/com/autoclicker/imageclicker
          cat > ic-android/app/src/main/java/com/autoclicker/imageclicker/MainActivity.kt <<'IC_EOF'
          package com.autoclicker.imageclicker

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var content: FrameLayout
              private lateinit var nav: LinearLayout
              private var tab = 0
              private val h = Handler(Looper.getMainLooper())

              private val REQ_CAPTURE = 1
              private val REQ_NOTIF = 2
              private var flow = false          // guided setup is running
              private var pending: String? = null
              private var askedNotif = false

              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_LONG).show()

              private fun accOn() = ClickerAccessibility.instance != null
              private fun ovlOn() = Settings.canDrawOverlays(this)
              private fun notifOn() = Build.VERSION.SDK_INT < 33 ||
                  checkSelfPermission("android.permission.POST_NOTIFICATIONS") == PackageManager.PERMISSION_GRANTED
              private fun batOn() = getSystemService(PowerManager::class.java).isIgnoringBatteryOptimizations(packageName)
              private fun isXiaomi() = listOf(Build.MANUFACTURER, Build.BRAND).any {
                  val s = it.lowercase()
                  s == "xiaomi" || s == "redmi" || s == "poco"
              }
              private fun xiaomiDone() = Store.prefs(this).getBoolean("xdone", false)

              // ------------------------------------------------------------------ shell

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Theme.BG
                  window.navigationBarColor = Theme.CARD

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Theme.BG)
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(16), dp(14), dp(16), dp(6))
                  }
                  header.addView(ImageView(this).apply { setImageResource(R.mipmap.ic_launcher) }, LinearLayout.LayoutParams(dp(38), dp(38)))
                  header.addView(
                      Ui.text(this, "Image Clicker", 22f, Theme.TEXT, true).apply { setPadding(dp(12), 0, 0, 0) }
                  )
                  root.addView(header)

                  content = FrameLayout(this)
                  root.addView(content, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))

                  nav = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Theme.CARD)
                  }
                  root.addView(nav, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))

                  setContentView(root)
                  show(0)
              }

              override fun onResume() {
                  super.onResume()
                  // short delay: the accessibility service needs a moment to connect after being enabled
                  h.postDelayed({
                      if (!isFinishing) {
                          show(tab)
                          if (flow) resumeFlow()
                      }
                  }, 500)
              }

              private fun show(i: Int) {
                  tab = i
                  content.removeAllViews()
                  content.addView(
                      when (i) {
                          0 -> homeView()
                          1 -> targetsView()
                          2 -> profilesView()
                          else -> helpView()
                      }
                  )
                  renderNav()
              }

              private fun renderNav() {
                  nav.removeAllViews()
                  val items = listOf(Ic.HOME to "Home", Ic.LIST to "Targets", Ic.SAVE to "Profiles", Ic.INFO to "Help")
                  items.forEachIndexed { i, item ->
                      val on = i == tab
                      val col = if (on) Theme.GOLD else Theme.MUTED
                      val v = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER_HORIZONTAL
                          setPadding(0, dp(10), 0, dp(10))
                          isClickable = true
                          setOnClickListener { show(i) }
                      }
                      v.addView(IconView(this, item.first, col), LinearLayout.LayoutParams(dp(24), dp(24)))
                      v.addView(Ui.text(this, item.second, 11f, col).apply { gravity = Gravity.CENTER })
                      nav.addView(v, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  }
              }

              private fun page(build: LinearLayout.() -> Unit): View {
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(8), dp(16), dp(16))
                  }
                  col.build()
                  return ScrollView(this).apply {
                      isVerticalScrollBarEnabled = false
                      addView(col)
                  }
              }

              // ------------------------------------------------------------------ dialogs

              private fun dialog(title: String, view: View, ok: String, onOk: () -> Unit) {
                  AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                      .setTitle(title)
                      .setView(view)
                      .setPositiveButton(ok) { _, _ -> onOk() }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun confirm(msg: String, onOk: () -> Unit) {
                  AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                      .setMessage(msg)
                      .setPositiveButton("Yes") { _, _ -> onOk() }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun askText(title: String, initial: String, onOk: (String) -> Unit) {
                  val et = EditText(this).apply {
                      setText(initial)
                      setTextColor(Color.WHITE)
                      setSingleLine()
                      setPadding(dp(20), dp(14), dp(20), dp(14))
                  }
                  dialog(title, et, "OK") { onOk(et.text.toString()) }
              }

              private fun editClickPoint(t: Target) {
                  val bmp = Targets.bitmap(this, t) ?: return
                  val tv = ThumbView(this, bmp, t.fx, t.fy, true)
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(8), dp(16), 0)
                  }
                  box.addView(Ui.text(this, "Tap the picture where the click should land.", 13f, Theme.MUTED))
                  box.addView(tv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(220)))
                  dialog("Click point: ${t.name}", box, "Save") {
                      val all = Targets.list(this)
                      all.firstOrNull { it.id == t.id }?.let { it.fx = tv.fx; it.fy = tv.fy }
                      Targets.saveAll(this, all)
                      ClickerService.instance?.reload()
                      show(1)
                  }
              }

              // ------------------------------------------------------------------ Home

              private fun homeView(): View = page {
                  val ctx = this@MainActivity
                  val running = ClickerService.instance != null
                  val ready = accOn() && ovlOn()

                  val hero = Ui.card(ctx)
                  hero.addView(
                      Ui.text(ctx, if (running) "Running" else if (ready) "Ready" else "Setup needed", 24f, Theme.TEXT, true)
                  )
                  hero.addView(
                      Ui.text(
                          ctx,
                          "Targets: ${Targets.list(ctx).size}    Tap points: ${Store.points(ctx).size}    Speed: ${Store.cps(ctx)}/s",
                          13f, Theme.MUTED
                      ).apply { setPadding(0, dp(4), 0, 0) }
                  )
                  val pf = Profiles.active(ctx)
                  if (pf.isNotEmpty()) hero.addView(Ui.text(ctx, "Profile: $pf", 13f, Theme.MUTED))
                  addView(hero)

                  val chk = Ui.card(ctx)
                  chk.addView(Ui.text(ctx, "Permissions", 16f, Theme.TEXT, true))
                  fun row(ok: Boolean, name: String, fix: (() -> Unit)?) {
                      val r = LinearLayout(ctx).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(0, dp(8), 0, dp(8))
                      }
                      r.addView(
                          IconView(ctx, if (ok) Ic.CHECK else Ic.WARN, if (ok) Theme.OK else Theme.GOLD),
                          LinearLayout.LayoutParams(dp(22), dp(22))
                      )
                      r.addView(
                          Ui.text(ctx, name, 14f).apply { setPadding(dp(10), 0, 0, 0) },
                          LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      )
                      if (!ok && fix != null) r.addView(Ui.chip(ctx, "Fix", true) { fix() })
                      chk.addView(r)
                  }
                  row(accOn(), "Accessibility service") { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  row(ovlOn(), "Display over other apps") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }
                  row(notifOn(), "Notifications") { requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), REQ_NOTIF) }
                  row(batOn(), "Battery: no restrictions") { askBattery() }
                  if (isXiaomi()) row(xiaomiDone(), "Xiaomi / POCO: autostart & pop-ups") { show(3) }
                  addView(chk)

                  addView(Ui.button(ctx, if (running) "Restart" else "Set up & Start", true, Ic.PLAY) {
