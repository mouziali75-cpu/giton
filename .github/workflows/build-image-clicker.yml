          package com.autoclicker.imageclicker

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream

          /**
           * One picture to look for.
           * fx/fy      = where the click lands, relative to the picture (0..1 = inside it, can go outside)
           * altOn/ax/ay = optional second click spot (used by condMode 1)
           * condMode   = 0 off | 1 use second spot when the text is visible | 2 click only if text visible | 3 click only if text NOT visible
           * regOn + rl..rb = optional screen area (fractions 0..1) where the text must be
           */
          class Target(
              val id: String,
              var name: String,
              var enabled: Boolean = true,
              var fx: Float = 0.5f,
              var fy: Float = 0.5f
          ) {
              var thr = 0                 // 0 = use the global sensitivity
              var cooldownMs = 1000       // wait after clicking this target
              var altOn = false
              var ax = 0.5f
              var ay = 0.5f
              var condMode = 0
              var condText = ""
              var regOn = false
              var rl = 0f
              var rt = 0f
              var rr = 1f
              var rb = 1f
          }

          object Targets {
              fun dir(c: Context): File = File(c.filesDir, "targets").apply { mkdirs() }
              private fun image(c: Context, t: Target): File = File(dir(c), t.id + ".png")

              fun list(c: Context): List<Target> {
                  val out = ArrayList<Target>()
                  try {
                      val f = File(dir(c), "meta.json")
                      if (f.exists()) {
                          val a = JSONArray(f.readText())
                          for (i in 0 until a.length()) {
                              val o = a.getJSONObject(i)
                              val id = o.getString("id")
                              if (File(dir(c), "$id.png").exists()) {
                                  val t = Target(
                                      id, o.optString("name", "Target"), o.optBoolean("on", true),
                                      o.optDouble("fx", 0.5).toFloat(), o.optDouble("fy", 0.5).toFloat()
                                  )
                                  t.thr = o.optInt("thr", 0)
                                  t.cooldownMs = o.optInt("cd", 1000)
                                  t.altOn = o.optBoolean("altOn", false)
                                  t.ax = o.optDouble("ax", 0.5).toFloat()
                                  t.ay = o.optDouble("ay", 0.5).toFloat()
                                  t.condMode = o.optInt("cm", 0)
                                  t.condText = o.optString("ct", "")
                                  t.regOn = o.optBoolean("regOn", false)
                                  t.rl = o.optDouble("rl", 0.0).toFloat()
                                  t.rt = o.optDouble("rt", 0.0).toFloat()
                                  t.rr = o.optDouble("rr", 1.0).toFloat()
                                  t.rb = o.optDouble("rb", 1.0).toFloat()
                                  out.add(t)
                              }
                          }
                      }
                  } catch (e: Exception) { }
                  return out
              }

              fun saveAll(c: Context, list: List<Target>) {
                  val a = JSONArray()
                  for (t in list) {
                      a.put(
                          JSONObject().put("id", t.id).put("name", t.name).put("on", t.enabled)
                              .put("fx", t.fx.toDouble()).put("fy", t.fy.toDouble())
                              .put("thr", t.thr).put("cd", t.cooldownMs)
                              .put("altOn", t.altOn).put("ax", t.ax.toDouble()).put("ay", t.ay.toDouble())
                              .put("cm", t.condMode).put("ct", t.condText)
                              .put("regOn", t.regOn).put("rl", t.rl.toDouble()).put("rt", t.rt.toDouble())
                              .put("rr", t.rr.toDouble()).put("rb", t.rb.toDouble())
                      )
                  }
                  val f = File(dir(c), "meta.json")
                  val tmp = File(dir(c), "meta.tmp")
                  tmp.writeText(a.toString())
                  if (!tmp.renameTo(f)) { f.writeText(a.toString()); tmp.delete() }
              }

              /** Writes the picture, returns the new Target (caller adds it to its list and calls saveAll). */
              fun createImage(c: Context, crop: Bitmap): Target {
                  val id = "t" + System.currentTimeMillis()
                  FileOutputStream(File(dir(c), "$id.png")).use { crop.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  return Target(id, "Target", true, 0.5f, 0.5f)
              }

              /** Swaps the picture of an existing target (keeps all its settings). */
              fun replaceImage(c: Context, t: Target, crop: Bitmap) {
                  FileOutputStream(image(c, t)).use { crop.compress(Bitmap.CompressFormat.PNG, 100, it) }
              }

              fun delete(c: Context, t: Target) {
                  image(c, t).delete()
                  saveAll(c, list(c).filter { it.id != t.id })
              }

              fun clear(c: Context) { dir(c).listFiles()?.forEach { it.delete() } }

              fun bitmap(c: Context, t: Target): Bitmap? = BitmapFactory.decodeFile(image(c, t).path)
          }
          IC_EOF
