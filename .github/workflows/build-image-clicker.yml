      - name: Build APK
        working-directory: ic-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp ic-android/app/build/outputs/apk/debug/app-debug.apk ImageClicker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ImageClicker-APK
          path: ImageClicker.apk

      - name: Publish release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: imageclicker-${{ github.run_number }}
          name: Image Clicker build ${{ github.run_number }}
          files: ImageClicker.apk
