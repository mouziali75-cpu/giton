name: Build Image Clicker APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        run: |
          set -e
          mkdir -p ic-android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p ic-android
          cat > ic-android/settings.gradle.kts <<'IC_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ImageClicker"
          include(":app")
          IC_EOF
          mkdir -p ic-android
          cat > ic-android/build.gradle.kts <<'IC_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          IC_EOF
          mkdir -p ic-android
          cat > ic-android/gradle.properties <<'IC_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          IC_EOF
          mkdir -p ic-android/app
          cat > ic-android/app/build.gradle.kts <<'IC_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.autoclicker.imageclicker"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.autoclicker.imageclicker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1"
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("org.opencv:opencv:4.9.0")
              implementation("com.google.mlkit:text-recognition:16.0.0")
          }
          IC_EOF
          mkdir -p ic-android/app/src/main
          cat > ic-android/app/src/main/AndroidManifest.xml <<'IC_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Image Clicker"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ClickerService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".ClickerAccessibility"
                      android:exported="true"
                      android:label="Image Clicker"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          IC_EOF
          mkdir -p ic-android/app/src/main/res/xml
          cat > ic-android/app/src/main/res/xml/accessibility_config.xml <<'IC_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          IC_EOF
          mkdir -p ic-android/app/src/main/res/values
          cat > ic-android/app/src/main/res/values/strings.xml <<'IC_EOF'
          <resources>
              <string name="accessibility_desc">Used only to perform taps on the screen for the auto clicker.</string>
          </resources>
          IC_EOF
          mkdir -p ic-android/app/src/main/java/com/autoclicker/imageclicker
          cat > ic-android/app/src/main/java/com/autoclicker/imageclicker/ClickerAccessibility.kt <<'IC_EOF'
          package com.autoclicker.imageclicker

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicBoolean

          /** Only job: perform a tap at (x, y). */
          class ClickerAccessibility : AccessibilityService() {

              companion object {
                  @Volatile var instance: ClickerAccessibility? = null
              }

              override fun onServiceConnected() { instance = this }

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  instance = null
                  super.onDestroy()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              @Volatile private var fails = 0
              @Volatile private var useLine = false

              /** Blocking tap (call from a background thread). Returns true when the system really performed it. */
              fun tap(x: Float, y: Float): Boolean {
                  val path = Path().apply {
                      moveTo(x, y)
                      if (useLine) lineTo(x + 1f, y)   // some MIUI / HyperOS builds ignore zero-length taps
                  }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 40))
                      .build()
                  val latch = CountDownLatch(1)
                  val done = AtomicBoolean(false)
                  val ok = dispatchGesture(gesture, object : GestureResultCallback() {
                      override fun onCompleted(g: GestureDescription?) { done.set(true); latch.countDown() }
                      override fun onCancelled(g: GestureDescription?) { latch.countDown() }
                  }, null)
                  if (!ok) return false
                  latch.await(500, TimeUnit.MILLISECONDS)
                  if (done.get()) {
                      fails = 0
                  } else {
                      fails++
                      if (fails >= 4) { useLine = !useLine; fails = 0 }
                  }
                  return done.get()
              }
          }
          IC_EOF
          mkdir -p ic-android/app/src/main/java/com/autoclicker/imageclicker
          cat > ic-android/app/src/main/java/com/autoclicker/imageclicker/ClickerService.kt <<'IC_EOF'
          package com.autoclicker.imageclicker

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.res.Configuration
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.graphics.PointF
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import android.util.DisplayMetrics
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import org.opencv.android.OpenCVLoader
          import org.opencv.android.Utils
          import com.google.android.gms.tasks.Tasks
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.TextRecognizer
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import org.opencv.core.Core
          import org.opencv.core.CvType
          import org.opencv.core.Mat
          import org.opencv.core.Size
          import org.opencv.imgproc.Imgproc
          import java.util.concurrent.TimeUnit

          class ClickerService : Service() {

              companion object {
                  const val ACTION_STOP = "com.autoclicker.imageclicker.STOP"
                  private const val CHANNEL = "clicker"
                  private const val SCALE = 0.5 // match on half-size images (faster)
                  @Volatile var instance: ClickerService? = null
              }

              /** Something to tap: key = cooldown id, x/y = screen pixels, cool = wait afterwards (ms). */
              private class Hit(val key: String, val x: Float, val y: Float, val cool: Long)

              private class TextLine(val text: String, val cx: Float, val cy: Float)

              /** One scaled copy of a target picture: grayscale + gradient (shape) map. */
              private class Var(val gray: Mat, val grad: Mat)

              private class Tpl(val t: Target, val vars: List<Var>) {
                  fun release() { vars.forEach { it.gray.release(); it.grad.release() } }
              }

              /** Current screenshot prepared for matching (gradient map is built only when needed). */
              private class Frm(val gray: Mat) {
                  var grad: Mat? = null
                  fun release() { gray.release(); grad?.release() }
              }

              private lateinit var wm: WindowManager
              private val ui = Handler(Looper.getMainLooper())

              private var projection: MediaProjection? = null
              private var reader: ImageReader? = null
              private var display: VirtualDisplay? = null
              private var sw = 0
              private var sh = 0
              private var lastFrame: Bitmap? = null

              private var panel: View? = null
              private var markers: View? = null
              private var editor: View? = null
              private var manager: View? = null
              private var playIcon: IconView? = null
              private var playWrap: View? = null
              private var eyeIcon: IconView? = null

              @Volatile private var running = false
              @Volatile private var gen = 0
              @Volatile private var pendingHits: List<Hit>? = null
              @Volatile private var holdUntil = 0L
              @Volatile private var tapFails = 0
              private val tplLock = Any()
              private val ocrLock = Any()
              private val cooldowns = HashMap<String, Long>()
              private var ocrCache: List<TextLine>? = null
              private var ocrAt = 0L
              @Volatile private var templates: List<Tpl> = emptyList()
              private var recognizer: TextRecognizer? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
              }

              private fun toast(t: String) { ui.post { Toast.makeText(this, t, Toast.LENGTH_SHORT).show() } }

              /** Called by the app after profiles / targets changed. */
              fun reload() {
                  reloadAsync()
                  ui.post { markers?.invalidate() }
              }

              private fun reloadAsync() {
                  Thread { try { loadTemplates() } catch (_: Throwable) { } }.start()
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  ui.postDelayed({ rebuildCapture() }, 400)
              }

              /** Screen rotated: resize the capture so screenshots and taps stay aligned. */
              @Suppress("DEPRECATION")
              private fun rebuildCapture() {
                  val d = display ?: return
                  val dm = DisplayMetrics()
                  wm.defaultDisplay.getRealMetrics(dm)
                  if (dm.widthPixels == sw && dm.heightPixels == sh) return
                  sw = dm.widthPixels
                  sh = dm.heightPixels
                  val rd = ImageReader.newInstance(sw, sh, PixelFormat.RGBA_8888, 2)
                  val old = reader
                  synchronized(this) { reader = rd; lastFrame = null }
                  d.resize(sw, sh, dm.densityDpi)
                  d.surface = rd.surface
                  old?.close()
                  markers?.invalidate()
              }

              @Suppress("DEPRECATION")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent == null || intent.action == ACTION_STOP) { stopSelf(); return START_NOT_STICKY }
                  if (projection != null) return START_NOT_STICKY

                  startForegroundCompat()

                  if (!OpenCVLoader.initLocal()) { toast("OpenCV failed to load"); stopSelf(); return START_NOT_STICKY }

                  val code = intent.getIntExtra("code", 0)
                  val data = intent.getParcelableExtra<Intent>("data")
                  if (data == null) { stopSelf(); return START_NOT_STICKY }

                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val mp = mpm.getMediaProjection(code, data)
                  projection = mp
                  mp.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { ui.post { stopSelf() } }
                  }, ui)

                  val dm = DisplayMetrics()
                  wm.defaultDisplay.getRealMetrics(dm)
                  sw = dm.widthPixels
                  sh = dm.heightPixels
                  val rd = ImageReader.newInstance(sw, sh, PixelFormat.RGBA_8888, 2)
                  reader = rd
                  display = mp.createVirtualDisplay(
                      "clicker", sw, sh, dm.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, rd.surface, null, null
                  )

                  loadTemplates()
                  applyMarkers()
                  showPanel()
                  toast("Ready. Open your game and use the floating bar.")
                  return START_NOT_STICKY
              }

              private fun startForegroundCompat() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(CHANNEL, "Image Clicker", NotificationManager.IMPORTANCE_LOW))
                  val stop = PendingIntent.getService(
                      this, 0, Intent(this, ClickerService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  val open = PendingIntent.getActivity(
                      this, 1, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  @Suppress("DEPRECATION")
                  val n = Notification.Builder(this, CHANNEL)
                      .setContentTitle("Image Clicker is running")
                      .setContentText("Tap to open the app. Use Stop to quit.")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentIntent(open)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Stop", stop)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else startForeground(1, n)
              }

              // ---------------------------------------------------------------- screen capture

              @Synchronized
              private fun grab(): Bitmap? {
                  val img = reader?.acquireLatestImage()
                  if (img != null) {
                      try {
                          val p = img.planes[0]
                          val rowPad = p.rowStride - p.pixelStride * img.width
                          val full = Bitmap.createBitmap(img.width + rowPad / p.pixelStride, img.height, Bitmap.Config.ARGB_8888)
                          full.copyPixelsFromBuffer(p.buffer)
                          if (rowPad == 0) {
                              lastFrame = full
                          } else {
                              lastFrame = Bitmap.createBitmap(full, 0, 0, img.width, img.height)
                              full.recycle()
                          }
                      } finally { img.close() }
                  }
                  return lastFrame
              }

              // ---------------------------------------------------------------- matching

              private fun toGray(b: Bitmap): Mat {
                  val m = Mat()
                  Utils.bitmapToMat(b, m)
                  Imgproc.cvtColor(m, m, Imgproc.COLOR_RGBA2GRAY)
                  Imgproc.resize(m, m, Size(), SCALE, SCALE, Imgproc.INTER_AREA)
                  return m
              }

              /** Edge strength map: matches the SHAPE even when colours or brightness differ. */
              private fun gradient(gray: Mat): Mat {
                  val g = Mat()
                  gray.convertTo(g, CvType.CV_32F)
                  val gx = Mat()
                  val gy = Mat()
                  Imgproc.Sobel(g, gx, CvType.CV_32F, 1, 0, 3)
                  Imgproc.Sobel(g, gy, CvType.CV_32F, 0, 1, 3)
                  val mag = Mat()
                  Core.magnitude(gx, gy, mag)
                  g.release(); gx.release(); gy.release()
                  return mag
              }

              private fun makeTpl(t: Target, bmp: Bitmap): Tpl {
                  val g = toGray(bmp)
                  val vars = ArrayList<Var>()
                  vars.add(Var(g, gradient(g)))
                  if (Store.flex(this)) {
                      // same picture a bit smaller / bigger
                      for (s in listOf(0.8, 1.25, 0.65, 1.5)) {
                          val o = Mat()
                          Imgproc.resize(g, o, Size(), s, s, if (s < 1.0) Imgproc.INTER_AREA else Imgproc.INTER_LINEAR)
                          if (o.cols() < 8 || o.rows() < 8) { o.release(); continue }
                          vars.add(Var(o, gradient(o)))
                      }
                  }
                  return Tpl(t, vars)
              }

              private fun loadTemplates() {
                  val fresh = Targets.list(this).filter { it.enabled }.mapNotNull { t ->
                      Targets.bitmap(this, t)?.let { makeTpl(t, it) }
                  }
                  synchronized(tplLock) {
                      val old = templates
                      templates = fresh
                      old.forEach { it.release() }
                  }
              }

              private fun thrFor(t: Target): Double = (if (t.thr > 0) t.thr else Store.threshold(this)) / 100.0

              private fun matchMat(src: Mat, tpl: Mat, t: Target): Found? {
                  if (tpl.cols() > src.cols() || tpl.rows() > src.rows()) return null
                  val r = Mat()
                  Imgproc.matchTemplate(src, tpl, r, Imgproc.TM_CCOEFF_NORMED)
                  val mm = Core.minMaxLoc(r)
                  r.release()
                  if (mm.maxVal.isNaN()) return null
                  val x = mm.maxLoc.x
                  val y = mm.maxLoc.y
                  return Found(
                      t,
                      (x / SCALE).toFloat(), (y / SCALE).toFloat(),
                      ((x + tpl.cols()) / SCALE).toFloat(), ((y + tpl.rows()) / SCALE).toFloat(),
                      mm.maxVal
                  )
              }

              /**
               * 1) exact look (grayscale, original size)
               * 2) if flex: same shape in other sizes / colours (edge map at several scales)
               */
              private fun matchTpl(frame: Frm, tpl: Tpl, thr: Double, flex: Boolean): Found? {
                  var best = matchMat(frame.gray, tpl.vars[0].gray, tpl.t)
                  if (best != null && best.score >= thr) return best
                  if (flex) {
                      val fg = frame.grad ?: gradient(frame.gray).also { frame.grad = it }
                      for (v in tpl.vars) {
                          val f = matchMat(fg, v.grad, tpl.t) ?: continue
                          if (f.score >= thr) return f
                          if (best == null || f.score > best.score) best = f
                      }
                  }
                  return best
              }

              // ---- cooldowns: every target / word waits on its own, so one button that stays on
              // screen can never block the others.

              private fun ready(key: String): Boolean =
                  synchronized(cooldowns) { SystemClock.uptimeMillis() >= (cooldowns[key] ?: 0L) }

              private fun markDone(key: String, ms: Long) {
                  synchronized(cooldowns) { cooldowns[key] = SystemClock.uptimeMillis() + ms }
              }

              // ---- screen text (offline OCR), shared by word clicking and text conditions

              private fun ocr(maxAge: Long): List<TextLine>? = synchronized(ocrLock) {
                  val now = SystemClock.uptimeMillis()
                  val cached = ocrCache
                  if (cached != null && now - ocrAt <= maxAge) return@synchronized cached
                  val bmp = grab() ?: return@synchronized null
                  val rec = recognizer ?: TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS).also { recognizer = it }
                  val res = Tasks.await(rec.process(InputImage.fromBitmap(bmp, 0)), 4, TimeUnit.SECONDS)
                  val out = ArrayList<TextLine>()
                  for (block in res.textBlocks) {
                      for (line in block.lines) {
                          val box = line.boundingBox ?: continue
                          out.add(TextLine(line.text.trim(), box.exactCenterX(), box.exactCenterY()))
                      }
                  }
                  ocrCache = out
                  ocrAt = SystemClock.uptimeMillis()
                  out
              }

              private fun textVisible(t: Target, lines: List<TextLine>): Boolean {
                  val words = t.condText.split(",").map { it.trim().lowercase() }.filter { it.isNotEmpty() }
                  if (words.isEmpty()) return false
                  for (l in lines) {
                      if (t.regOn && sw > 0 && sh > 0) {
                          val fx = l.cx / sw
                          val fy = l.cy / sh
                          if (fx < t.rl || fx > t.rr || fy < t.rt || fy > t.rb) continue
                      }
                      val s = l.text.lowercase()
                      for (w in words) if (s.contains(w)) return true
                  }
                  return false
              }

              /** All picture targets that are on screen right now (and not cooling down), with their click spot. */
              private fun scanPictures(flex: Boolean): List<Hit> {
                  val out = ArrayList<Hit>()
                  val bmp = grab() ?: return out
                  val found = ArrayList<Found>()
                  synchronized(tplLock) {
                      if (templates.isEmpty()) return out
                      val frame = Frm(toGray(bmp))
                      try {
                          for (tpl in templates) {
                              if (!ready("p" + tpl.t.id)) continue
                              val thr = thrFor(tpl.t)
                              val f = matchTpl(frame, tpl, thr, flex) ?: continue
                              if (f.score >= thr) found.add(f)
                          }
                      } finally { frame.release() }
                  }
                  var lines: List<TextLine>? = null
                  var ocrFailed = false
                  for (f in found) {
                      val t = f.t
                      if (t.condMode > 0) {
                          if (lines == null && !ocrFailed) {
                              lines = try { ocr(300) } catch (e: Throwable) { null }
                              if (lines == null) ocrFailed = true
                          }
                          val ls = lines ?: continue
                          val vis = textVisible(t, ls)
                          when (t.condMode) {
                              1 -> f.alt = vis
                              2 -> if (!vis) continue
                              3 -> if (vis) continue
                          }
                      }
                      out.add(Hit("p" + t.id, f.clickX(), f.clickY(), t.cooldownMs.toLong()))
                  }
                  return out
              }

              /** Enabled words found on screen (centre of each matching line). */
              private fun scanText(): List<Hit> {
                  val words = Store.words(this).filter { it.second }.map { it.first.trim().lowercase() }.filter { it.isNotEmpty() }
                  if (words.isEmpty()) return emptyList()
                  val lines = ocr(200) ?: return emptyList()
                  val out = ArrayList<Hit>()
                  for (l in lines) {
                      val txt = l.text.lowercase()
                      for (w in words) {
                          if (txt == w || (txt.contains(w) && txt.length <= w.length + 8)) {
                              val key = "w$w"
                              if (ready(key) && out.none { it.key == key }) out.add(Hit(key, l.cx, l.cy, 1500L))
                              break
                          }
                      }
                  }
                  return out
              }

              /** Every picture target (enabled or not) visible in this screenshot, for the editor. */
              private fun matchAll(frameBmp: Bitmap, list: List<Target>): List<Found> {
                  val frame = Frm(toGray(frameBmp))
                  val out = ArrayList<Found>()
                  try {
                      for (t in list) {
                          val bmp = Targets.bitmap(this, t) ?: continue
                          val tpl = makeTpl(t, bmp)
                          val thr = thrFor(t)
                          val f = matchTpl(frame, tpl, thr, Store.flex(this))
                          tpl.release()
                          if (f != null && f.score >= thr) out.add(f)
                      }
                  } finally { frame.release() }
                  return out
              }

              // ---------------------------------------------------------------- main loops

              private fun updatePlay() {
                  playIcon?.kind = if (running) Ic.PAUSE else Ic.PLAY
                  playIcon?.invalidate()
                  playWrap?.background = if (running) rounded(Theme.ACCENT, dpf(14f)) else null
              }

              private fun setRunning(on: Boolean) {
                  if (on == running) return
                  if (on) {
                      if (ClickerAccessibility.instance == null) { toast("Accessibility service is OFF. Open the app."); return }
                      running = true
                      pendingHits = null
                      holdUntil = 0L
                      tapFails = 0
                      val g = ++gen
                      Thread { tapLoop(g) }.start()
                      Thread { scanLoop(g) }.start()
                  } else {
                      running = false
                      gen++
                  }
                  updatePlay()
              }

              private fun tapAt(acc: ClickerAccessibility, x: Float, y: Float) {
                  val tx = x.coerceIn(1f, (sw - 2).toFloat().coerceAtLeast(2f))
                  val ty = y.coerceIn(1f, (sh - 2).toFloat().coerceAtLeast(2f))
                  if (acc.tap(tx, ty)) {
                      tapFails = 0
                  } else {
                      tapFails++
                      if (tapFails == 15) toast("The system is blocking taps. Open the app > Help tab (Xiaomi / POCO steps).")
                  }
              }

              /** Taps: every button that was found first (each on its own cooldown), otherwise the farm points in turn. */
              private fun tapLoop(g: Int) {
                  var idx = 0
                  while (running && g == gen) {
                      val acc = ClickerAccessibility.instance
                      if (acc == null) {
                          running = false
                          ui.post { updatePlay(); toast("Accessibility got turned off. Re-enable it in the app.") }
                          return
                      }
                      val hs = pendingHits
                      if (hs != null) {
                          pendingHits = null
                          for (h in hs) {
                              if (!running || g != gen) break
                              if (!ready(h.key)) continue
                              tapAt(acc, h.x, h.y)
                              markDone(h.key, h.cool)
                              SystemClock.sleep(350)
                          }
                          holdUntil = SystemClock.uptimeMillis() + 300
                          continue
                      }
                      val pts = Store.points(this)
                      val pt = if (pts.isEmpty()) Pair(sw / 2f, sh / 2f) else pts[idx++ % pts.size]
                      tapAt(acc, pt.first, pt.second)
                      SystemClock.sleep((1000L / Store.cps(this)).coerceAtLeast(1L))
                  }
              }

              /** Looks at the screen in parallel, so farming never slows down. */
              private fun scanLoop(g: Int) {
                  var n = 0
                  var lastText = 0L
                  while (running && g == gen) {
                      val now = SystemClock.uptimeMillis()
                      if (pendingHits == null && now >= holdUntil) {
                          // exact look every scan, flexible (shape) matching every 3rd scan: lighter on battery
                          val flex = Store.flex(this) && n % 3 == 0
                          val found = ArrayList<Hit>()
                          try { found.addAll(scanPictures(flex)) } catch (e: Throwable) { }
                          if (found.isEmpty() && now - lastText >= Store.textMs(this)) {
                              lastText = now
                              try { found.addAll(scanText()) } catch (e: Throwable) { }
                          }
                          if (found.isNotEmpty() && g == gen) pendingHits = found
                          n++
                      }
                      SystemClock.sleep(Store.scanMs(this))
                  }
              }

              // ---------------------------------------------------------------- overlays

              private fun overlayType() = WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY

              private fun fullScreenParams(touchable: Boolean): WindowManager.LayoutParams {
                  var flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  if (!touchable) flags = flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      overlayType(), flags, PixelFormat.TRANSLUCENT
                  )
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  return lp
              }

              private fun applyMarkers() {
                  if (markers == null) {
                      val v = MarkersView(this) { Pair(sw, sh) }
                      wm.addView(v, fullScreenParams(false))
                      markers = v
                  }
                  markers?.visibility = if (Store.markers(this)) View.VISIBLE else View.GONE
                  markers?.invalidate()
                  eyeIcon?.color = if (Store.markers(this)) Theme.GOLD else Theme.ICON
                  eyeIcon?.invalidate()
              }

              private fun barButton(kind: Int, onClick: () -> Unit): FrameLayout {
                  val icon = IconView(this, kind)
                  return FrameLayout(this).apply {
                      addView(icon, FrameLayout.LayoutParams(dp(22), dp(22), Gravity.CENTER))
                      layoutParams = LinearLayout.LayoutParams(dp(46), dp(46))
                      isClickable = true
                      setOnClickListener { onClick() }
                  }
              }

              private fun showPanel() {
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      overlayType(), WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START; x = dp(4); y = dp(180) }

                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(0xEE1C1445.toInt(), dpf(24f), Theme.ACCENT, dp(1))
                      setPadding(dp(3), dp(4), dp(3), dp(4))
                  }

                  // drag handle
                  val grip = barButton(Ic.GRIP) {}
                  var dx = 0f; var dy = 0f; var sx = 0; var sy = 0
                  grip.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { dx = e.rawX; dy = e.rawY; sx = lp.x; sy = lp.y }
                          MotionEvent.ACTION_MOVE -> {
                              lp.x = sx + (e.rawX - dx).toInt()
                              lp.y = sy + (e.rawY - dy).toInt()
                              wm.updateViewLayout(col, lp)
                          }
                      }
                      true
                  }
                  col.addView(grip)

                  val play = barButton(Ic.PLAY) { setRunning(!running) }
                  playWrap = play
                  playIcon = play.getChildAt(0) as IconView
                  col.addView(play)

                  col.addView(barButton(Ic.PENCIL) { openEditor() })

                  val eye = barButton(Ic.EYE) {
                      Store.setMarkers(this, !Store.markers(this))
                      applyMarkers()
                  }
                  eyeIcon = eye.getChildAt(0) as IconView
                  col.addView(eye)

                  col.addView(barButton(Ic.SLIDERS) { openManager(null) })
                  col.addView(barButton(Ic.CLOSE) { stopSelf() })

                  wm.addView(col, lp)
                  panel = col
                  applyMarkers() // refresh eye colour
              }

              private fun restoreUi() {
                  panel?.visibility = View.VISIBLE
                  applyMarkers()
              }

              // ---------------------------------------------------------------- manager (everything, from the floating bar)

              private val host = object : ManagerHost {
                  override fun close() { closeManager() }
                  override fun changed() { applyMarkers(); reloadAsync() }
                  override fun newTarget() { openEditor(1, null) }
                  override fun retake(t: Target) { openEditor(3, t) }
                  override fun pickRegion(t: Target) { openEditor(2, t) }
              }

              private fun closeManager() {
                  manager?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  manager = null
                  reloadAsync()
              }

              private fun openManager(startId: String?) {
                  if (manager != null || editor != null) return
                  setRunning(false)
                  val v = ManagerView(this, startId, host)
                  val lp = WindowManager.LayoutParams(
                      (sw * 0.94).toInt(), (sh * 0.84).toInt(),
                      overlayType(), 0, PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.CENTER
                      softInputMode = WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE
                  }
                  wm.addView(v, lp)
                  v.requestFocus()
                  manager = v
              }

              // ---------------------------------------------------------------- editor

              private fun closeEditor() {
                  editor?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  editor = null
                  restoreUi()
              }

              /** startMode: 0 = points + click dots, 1 = new picture, 2 = pick the text area of [tgt], 3 = retake the picture of [tgt]. */
              private fun openEditor(startMode: Int = 0, tgt: Target? = null) {
                  if (editor != null) return
                  setRunning(false)
                  closeManager()
                  // hide our own overlays so they are not in the frozen screenshot
                  panel?.visibility = View.GONE
                  markers?.visibility = View.GONE
                  ui.postDelayed({ buildEditor(startMode, tgt) }, 300)
              }

              private fun buildEditor(startMode: Int, tgt: Target?) {
                  val frame = grab()
                  if (frame == null) {
                      toast("No screen image yet, try again")
                      restoreUi()
                      if (tgt != null) openManager(tgt.id)
                      return
                  }

                  val targets = Targets.list(this).toMutableList()
                  val pts = Store.points(this).map { PointF(it.first, it.second) }.toMutableList()
                  val view = EditorView(this, frame, pts, emptyList())
                  val hint = Ui.text(this, "", 13f, Theme.TEXT).apply {
                      background = rounded(0xCC0F0A28.toInt(), dpf(12f))
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                  }
                  var chipP: TextView? = null
                  var chipT: TextView? = null
                  var visible = 0

                  fun setMode(m: Int) {
                      view.mode = m
                      chipP?.background = rounded(if (m == 0) Theme.ACCENT else Theme.CARD2, dpf(14f))
                      chipT?.background = rounded(if (m == 1) Theme.ACCENT else Theme.CARD2, dpf(14f))
                      hint.text = when {
                          startMode == 2 -> "Drag a box around the area where the text appears."
                          startMode == 3 -> "Drag a box tightly around the new picture for ${tgt?.name ?: "the target"}."
                          m == 0 ->
                              "Tap empty space: add a tap point. Drag a point to move it, drop it on the trash to delete. " +
                                  "Drag a gold dot to change where a target is clicked (green = second spot). " +
                                  "($visible of ${targets.size} targets visible now)"
                          else -> "Drag a box tightly around the button you want to click."
                      }
                      view.invalidate()
                  }

                  fun rescan() {
                      val snap = targets.toList()
                      Thread {
                          val found = try { matchAll(frame, snap) } catch (e: Exception) { emptyList() }
                          ui.post {
                              if (editor != null) {
                                  view.found = found
                                  visible = found.size
                                  setMode(view.mode)
                              }
                          }
                      }.start()
                  }

                  view.onBox = { r ->
                      val l = r.left.toInt().coerceIn(0, frame.width - 1)
                      val t = r.top.toInt().coerceIn(0, frame.height - 1)
                      val rr = r.right.toInt().coerceIn(l + 1, frame.width)
                      val bb = r.bottom.toInt().coerceIn(t + 1, frame.height)
                      if (rr - l < 16 || bb - t < 16) {
                          toast("Box too small, try again")
                      } else if (startMode == 2 && tgt != null) {
                          val w = frame.width.toFloat()
                          val hh = frame.height.toFloat()
                          targets.firstOrNull { it.id == tgt.id }?.let {
                              it.regOn = true
                              it.rl = l / w
                              it.rt = t / hh
                              it.rr = rr / w
                              it.rb = bb / hh
                          }
                          Targets.saveAll(this, targets)
                          toast("Area saved")
                          ui.post { closeEditor(); openManager(tgt.id) }
                      } else if (startMode == 3 && tgt != null) {
                          val crop = Bitmap.createBitmap(frame, l, t, rr - l, bb - t)
                          Targets.replaceImage(this, tgt, crop)
                          toast("Picture replaced")
                          ui.post { closeEditor(); openManager(tgt.id) }
                      } else {
                          val crop = Bitmap.createBitmap(frame, l, t, rr - l, bb - t)
                          val tg = Targets.createImage(this, crop)
                          tg.name = "Target ${targets.size + 1}"
                          targets.add(tg)
                          Targets.saveAll(this, targets)
                          toast("Target added")
                          if (startMode == 1) {
                              ui.post { closeEditor(); openManager(tg.id) }
                          } else {
                              reloadAsync()
                              rescan()
                              setMode(0)
                          }
                      }
                  }

                  val root = FrameLayout(this)
                  root.addView(view, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  if (startMode < 2) {
                      val cp = Ui.chip(this, "Points", true) { setMode(0) }
                      val ct = Ui.chip(this, "New target", false) { setMode(1) }
                      chipP = cp
                      chipT = ct
                      bar.addView(cp)
                      bar.addView(View(this), LinearLayout.LayoutParams(dp(8), dp(1)))
                      bar.addView(ct)
                  }
                  bar.addView(View(this), LinearLayout.LayoutParams(0, dp(1), 1f))
                  bar.addView(Ui.iconBtn(this, Ic.CLOSE) {
                      closeEditor()
                      if (tgt != null) openManager(tgt.id)
                  })
                  if (startMode < 2) {
                      bar.addView(Ui.iconBtn(this, Ic.CHECK, Theme.GOLD) {
                          Store.setPoints(this, pts.map { Pair(it.x, it.y) })
                          Targets.saveAll(this, targets)
                          reloadAsync()
                          closeEditor()
                          toast("Saved")
                      })
                  }
                  root.addView(bar, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.TOP
                  ).apply { topMargin = dp(36); leftMargin = dp(12); rightMargin = dp(12) })
                  root.addView(hint, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.TOP
                  ).apply { topMargin = dp(92); leftMargin = dp(12); rightMargin = dp(12) })

                  wm.addView(root, fullScreenParams(true))
                  editor = root
                  setMode(if (startMode == 1 || startMode >= 2) 1 else 0)
                  rescan()
              }

              // ---------------------------------------------------------------- cleanup

              override fun onDestroy() {
                  running = false
                  gen++
                  editor?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  manager?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  panel?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  markers?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  display?.release()
                  reader?.close()
                  projection?.stop()
                  try { recognizer?.close() } catch (_: Throwable) {}
                  instance = null
                  super.onDestroy()
              }
          }
          IC_EOF
          mkdir -p ic-android/app/src/main/java/com/autoclicker/imageclicker
          cat > ic-android/app/src/main/java/com/autoclicker/imageclicker/EditorView.kt <<'IC_EOF'
          package com.autoclicker.imageclicker

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.PointF
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min

          /** A target found on the frozen screenshot. Coordinates are screenshot pixels. */
          class Found(val t: Target, val l: Float, val top: Float, val r: Float, val b: Float, val score: Double) {
              /** true = use the second click spot of the target */
              var alt = false
              fun normX(): Float = l + (r - l) * t.fx
              fun normY(): Float = top + (b - top) * t.fy
              fun altX(): Float = l + (r - l) * t.ax
              fun altY(): Float = top + (b - top) * t.ay
              fun clickX(): Float = if (alt && t.altOn) altX() else normX()
              fun clickY(): Float = if (alt && t.altOn) altY() else normY()
          }

          /**
           * Full-screen editor on top of a frozen screenshot.
           *  mode 0: tap empty space = add tap point, drag a numbered point = move it (drop on trash = delete),
           *          drag a gold dot = change where that target is clicked.
           *  mode 1: drag a box = create a new target.
           */
          class EditorView(
              c: Context,
              private val bmp: Bitmap,
              val points: MutableList<PointF>,
              var found: List<Found>
          ) : View(c) {

              var mode = 0
              var onBox: ((RectF) -> Unit)? = null

              private val fillP = Paint(Paint.ANTI_ALIAS_FLAG)
              private val strokeP = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE }
              private val textP = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  textAlign = Paint.Align.CENTER
                  typeface = Typeface.DEFAULT_BOLD
              }
              private val iconP = Paint(Paint.ANTI_ALIAS_FLAG)

              private var dragPoint = -1
              private var dragDot = -1
              private var dragAlt = false
              private var tapCandidate = false
              private var downX = 0f
              private var downY = 0f
              private var boxStart: PointF? = null
              private var boxEnd: PointF? = null
              private var overTrash = false

              private fun sx(): Float = width.toFloat() / bmp.width
              private fun sy(): Float = height.toFloat() / bmp.height

              override fun onDraw(cv: Canvas) {
                  val sx = sx()
                  val sy = sy()
                  val d = context.dpf(1f)
                  cv.drawBitmap(bmp, null, RectF(0f, 0f, width.toFloat(), height.toFloat()), null)
                  cv.drawColor(0x66000000)

                  // targets that are visible on this screen
                  for (f in found) {
                      val box = RectF(f.l * sx, f.top * sy, f.r * sx, f.b * sy)
                      strokeP.color = if (f.t.enabled) Theme.GOLD else Theme.MUTED
                      strokeP.strokeWidth = 2.5f * d
                      cv.drawRoundRect(box, 6 * d, 6 * d, strokeP)

                      val label = "${f.t.name} ${(f.score * 100).toInt()}%"
                      textP.textSize = 12 * d
                      textP.color = Theme.TEXT
                      val tw = textP.measureText(label) + 14 * d
                      fillP.color = 0xCC000000.toInt()
                      cv.drawRoundRect(RectF(box.left, box.top - 24 * d, box.left + tw, box.top - 3 * d), 6 * d, 6 * d, fillP)
                      cv.drawText(label, box.left + tw / 2, box.top - 9 * d, textP)

                      fun dot(px: Float, py: Float, col: Int, tag: String) {
                          val cx = px * sx
                          val cy = py * sy
                          fillP.color = col
                          cv.drawCircle(cx, cy, 9 * d, fillP)
                          strokeP.color = Color.WHITE
                          strokeP.strokeWidth = 2 * d
                          cv.drawCircle(cx, cy, 9 * d, strokeP)
                          strokeP.color = col
                          cv.drawLine(cx - 18 * d, cy, cx - 12 * d, cy, strokeP); cv.drawLine(cx + 12 * d, cy, cx + 18 * d, cy, strokeP)
                          cv.drawLine(cx, cy - 18 * d, cx, cy - 12 * d, strokeP); cv.drawLine(cx, cy + 12 * d, cx, cy + 18 * d, strokeP)
                          if (tag.isNotEmpty()) {
                              textP.textSize = 10 * d
                              textP.color = Color.BLACK
                              cv.drawText(tag, cx, cy + 3.5f * d, textP)
                          }
                      }
                      dot(f.normX(), f.normY(), Theme.GOLD, "")
                      if (f.t.altOn) dot(f.altX(), f.altY(), Theme.OK, "2")
                  }

                  // tap points
                  points.forEachIndexed { i, p ->
                      val x = p.x * sx
                      val y = p.y * sy
                      fillP.color = Theme.ACCENT
                      cv.drawCircle(x, y, 15 * d, fillP)
                      strokeP.color = Color.WHITE
                      strokeP.strokeWidth = 2.5f * d
                      cv.drawCircle(x, y, 15 * d, strokeP)
                      textP.textSize = 14 * d
                      textP.color = Color.WHITE
                      cv.drawText("${i + 1}", x, y + 5 * d, textP)
                  }

                  // box being drawn
                  val a = boxStart
                  val b = boxEnd
                  if (mode == 1 && a != null && b != null) {
                      strokeP.color = Theme.GOLD
                      strokeP.strokeWidth = 3 * d
                      cv.drawRect(min(a.x, b.x), min(a.y, b.y), max(a.x, b.x), max(a.y, b.y), strokeP)
                  }

                  // trash zone while dragging a point
                  if (dragPoint >= 0) {
                      fillP.color = if (overTrash) 0xCCF87171.toInt() else 0x99000000.toInt()
                      cv.drawRoundRect(RectF(width * 0.25f, height - 110 * d, width * 0.75f, height - 40 * d), 18 * d, 18 * d, fillP)
                      Ic.draw(cv, Ic.TRASH, iconP, Theme.TEXT, width / 2f - 16 * d, height - 92 * d, 32 * d)
                  }
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  val sx = sx()
                  val sy = sy()
                  val d = context.dpf(1f)
                  when (e.action) {
                      MotionEvent.ACTION_DOWN -> {
                          downX = e.x; downY = e.y
                          dragPoint = -1; dragDot = -1; tapCandidate = false; overTrash = false
                          if (mode == 0) {
                              for (i in points.indices.reversed()) {
                                  val p = points[i]
                                  if (hypot(e.x - p.x * sx, e.y - p.y * sy) < 30 * d) { dragPoint = i; break }
                              }
                              if (dragPoint < 0) {
                                  for (i in found.indices.reversed()) {
                                      val f = found[i]
                                      if (f.t.altOn && hypot(e.x - f.altX() * sx, e.y - f.altY() * sy) < 26 * d) { dragDot = i; dragAlt = true; break }
                                      if (hypot(e.x - f.normX() * sx, e.y - f.normY() * sy) < 26 * d) { dragDot = i; dragAlt = false; break }
                                  }
                              }
                              if (dragPoint < 0 && dragDot < 0) tapCandidate = true
                          } else {
                              boxStart = PointF(e.x, e.y)
                              boxEnd = PointF(e.x, e.y)
                          }
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (hypot(e.x - downX, e.y - downY) > 10 * d) tapCandidate = false
                          if (dragPoint >= 0) {
                              points[dragPoint].set(
                                  (e.x / sx).coerceIn(0f, bmp.width - 1f),
                                  (e.y / sy).coerceIn(0f, bmp.height - 1f)
                              )
                              overTrash = e.y > height - 130 * d
                          } else if (dragDot >= 0) {
                              val f = found[dragDot]
                              val nx = ((e.x / sx - f.l) / (f.r - f.l)).coerceIn(-5f, 6f)
                              val ny = ((e.y / sy - f.top) / (f.b - f.top)).coerceIn(-5f, 6f)
                              if (dragAlt) { f.t.ax = nx; f.t.ay = ny } else { f.t.fx = nx; f.t.fy = ny }
                          } else if (mode == 1) {
                              boxEnd = PointF(e.x, e.y)
                          }
                      }
                      MotionEvent.ACTION_UP -> {
                          if (dragPoint >= 0) {
                              if (overTrash) points.removeAt(dragPoint)
                          } else if (dragDot >= 0) {
                              // offset already updated while dragging
                          } else if (mode == 0 && tapCandidate) {
                              points.add(PointF((e.x / sx).coerceIn(0f, bmp.width - 1f), (e.y / sy).coerceIn(0f, bmp.height - 1f)))
                          } else if (mode == 1) {
                              val a = boxStart
                              val b = boxEnd
                              if (a != null && b != null) {
                                  onBox?.invoke(RectF(min(a.x, b.x) / sx, min(a.y, b.y) / sy, max(a.x, b.x) / sx, max(a.y, b.y) / sy))
                              }
                              boxStart = null; boxEnd = null
                          }
                          dragPoint = -1; dragDot = -1; tapCandidate = false; overTrash = false
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          dragPoint = -1; dragDot = -1; tapCandidate = false; overTrash = false
                          boxStart = null; boxEnd = null
                      }
                  }
                  invalidate()
                  return true
              }
          }

          /** Transparent overlay that shows numbered rings where the farm taps land. */
          class MarkersView(c: Context, private val size: () -> Pair<Int, Int>) : View(c) {
              private val fillP = Paint(Paint.ANTI_ALIAS_FLAG)
              private val strokeP = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE }
              private val textP = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  textAlign = Paint.Align.CENTER
                  typeface = Typeface.DEFAULT_BOLD
                  color = Color.WHITE
              }

              override fun onDraw(cv: Canvas) {
                  val d = context.dpf(1f)
                  val sz = size()
                  val kx = width.toFloat() / sz.first
                  val ky = height.toFloat() / sz.second
                  Store.points(context).forEachIndexed { i, p ->
                      val x = p.first * kx
                      val y = p.second * ky
                      fillP.color = 0x667C5CFF
                      cv.drawCircle(x, y, 16 * d, fillP)
                      strokeP.color = Color.WHITE
                      strokeP.strokeWidth = 2 * d
                      cv.drawCircle(x, y, 16 * d, strokeP)
                      textP.textSize = 13 * d
                      cv.drawText("${i + 1}", x, y + 4.5f * d, textP)
                  }
              }
          }
          IC_EOF
